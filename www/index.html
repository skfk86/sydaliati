<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B6E5B">
<meta name="color-scheme" content="light dark">
<title>حبّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --brand:#0B6E5B; --brand-dark:#08513F; --brand-soft:#E3F2EC; --brand-mint:#7FD4BA;
  --ink:#10201C; --ink-2:#3B4A46; --muted:#5B6B67; --faint:#8A9894;
  --line:#E3E9E7; --line-2:#EEF2F1; --field:#F0F4F3; --bg:#F5F7F6; --card:#FFFFFF;
  --blue:#1D4ED8; --blue-soft:#E6EEFD; --amber:#B54708; --amber-soft:#FEF0E1;
  --red:#B42318; --red-soft:#FDE8E8; --gold:#F59E0B;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --line-strong:#D5DEDB; --inv:#10201C; --inv-muted:#B9CBC5; --closed:#5B6B67; --warn-ink:#7A3A06;
  --gold-ink:#7A4B00; --gold-soft:#FDF1D6; --gold-bg:#FFFBF0; --gold-line:#F6DFA6;
  --sk1:#E9EEEC; --sk2:#F3F6F5; --map-bg:#E4EEEA; --drop-line:#9FC9BB; --drop-bg:#F3FAF7;
  --t0-bg:#E3F2EC; --t0-fg:#0B6E5B; --t1-bg:#E6EEFD; --t1-fg:#1D4ED8; --t2-bg:#FEF0E1; --t2-fg:#B54708;
  --t3-bg:#F1E8FD; --t3-fg:#6D28D9; --t4-bg:#FDE8E8; --t4-fg:#B42318;
  --shadow-sm:0 1px 2px rgba(16,32,28,.04),0 2px 10px rgba(16,32,28,.04);
  --shadow-md:0 2px 6px rgba(16,32,28,.05),0 10px 28px rgba(16,32,28,.08);
  --hero-ink:#CDE9E0;
  color-scheme: light;
}
/* ===== الوضع الليلي: يتبع إعداد الهاتف ===== */
@media (prefers-color-scheme: dark) {
  :root {
    --brand:#14916F; --brand-dark:#0B6E5B; --brand-soft:rgba(20,145,111,.18); --brand-mint:#7FD4BA;
    --ink:#E6EEEB; --ink-2:#C2CFCA; --muted:#93A39E; --faint:#6F807A;
    --line:#24312D; --line-2:#1E2926; --line-strong:#33433E; --field:#1C2724; --bg:#0D1412; --card:#151F1C;
    --blue:#8AB0FF; --blue-soft:rgba(96,140,255,.16); --amber:#F6AD5F; --amber-soft:rgba(246,173,95,.14);
    --red:#FF8A80; --red-soft:rgba(255,120,110,.14); --inv:#1F2D29; --inv-muted:#9FB4AD; --closed:#3A4A45; --warn-ink:#F6C79A;
    --gold-ink:#F3CF7A; --gold-soft:rgba(243,207,122,.14); --gold-bg:rgba(243,207,122,.07); --gold-line:rgba(243,207,122,.28);
    --sk1:#1A2522; --sk2:#22302C; --map-bg:#1A2522; --drop-line:#2E5A4D; --drop-bg:rgba(20,145,111,.07);
    --t0-bg:rgba(20,145,111,.18); --t0-fg:#5FD3AE; --t1-bg:rgba(96,140,255,.16); --t1-fg:#9DBBFF; --t2-bg:rgba(246,173,95,.15); --t2-fg:#F6B36B;
    --t3-bg:rgba(167,139,250,.16); --t3-fg:#C4B1FF; --t4-bg:rgba(255,120,110,.15); --t4-fg:#FF9C93;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  .hero, .topbar, .nav { border-color: var(--line); }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6); }
  html .notice.ok { color: #9BE3C9; } html .notice.info { color: #B9CCFF; }
  html .bubble.me { background: #127F62; }
  html .hero { background: #0C5E4D; }
  html .toggle-card[aria-pressed="true"] { background: #0F7A60 !important; }
}

/* ===== لمسات احترافية ===== */
html { scroll-behavior: smooth; }
body { font-feature-settings: "kern"; text-rendering: optimizeLegibility; }
.screen { animation: enter .32s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.card, .list-card, .cat span, .search-float { box-shadow: var(--shadow-sm); }
.search-float { box-shadow: var(--shadow-md); }
.list-card, .btn, .chip, .cat, .icon-btn, .toggle-card, .seg button, .nav a { transition: transform .15s ease, background-color .2s, box-shadow .2s, opacity .2s; }
.list-card:active, .btn:active, .cat:active, .toggle-card:active { transform: scale(.98); }
.chip:active, .icon-btn:active, .nav a:active { transform: scale(.94); }
.btn-primary { box-shadow: 0 6px 16px rgba(11,110,91,.22); }
.hero { position: relative; overflow: hidden; }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.06); pointer-events: none; }
.hero::before { width: 240px; height: 240px; top: -90px; left: -70px; }
.hero::after { width: 140px; height: 140px; bottom: -50px; left: 120px; background: rgba(255,255,255,.04); }
.hero > * { position: relative; }
.hero h1 { letter-spacing: -.2px; }
.section-head h2, .page-title h1 { letter-spacing: -.2px; }
.nav { box-shadow: 0 -4px 20px rgba(16,32,28,.05); backdrop-filter: saturate(1.4) blur(10px); }
.nav a.on::before { content: ""; position: absolute; top: 2px; width: 48px; height: 32px; border-radius: 12px; background: var(--brand-soft); z-index: -1; }
.nav a { z-index: 0; }
.nav a svg { margin-top: 4px; }
.avatar { box-shadow: inset 0 0 0 1px rgba(0,0,0,.02); }
.badge { letter-spacing: .1px; }
.sheet { box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
.empty .ic { box-shadow: 0 8px 24px rgba(11,110,91,.12); }
::selection { background: var(--brand-soft); }

/* ===== شاشة البداية داخل التطبيق ===== */
#boot { position: fixed; inset: 0; z-index: 200; background: #0B6E5B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #fff; transition: opacity .45s ease, visibility .45s; }
#boot.hide { opacity: 0; visibility: hidden; }
#boot .logo { width: 96px; height: 96px; border-radius: 28px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(0,0,0,.22); animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
#boot .name { font-size: 24px; font-weight: 700; animation: rise .6s .1s both; }
#boot .tag { font-size: 14px; color: #CDE9E0; animation: rise .6s .2s both; }
#boot .bar { width: 54px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; margin-top: 18px; }
#boot .bar i { display: block; width: 40%; height: 100%; background: #fff; border-radius: 4px; animation: slide 1s ease-in-out infinite; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
@keyframes slide { 0% { transform: translateX(160%); } 100% { transform: translateX(-160%); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow-x:hidden;max-width:100%}
input,select,textarea{min-width:0;max-width:100%}
.searchbox input,.search-float input,.composer input[type=text]{width:100%;min-width:0}
.search-float form,.searchbox,.row > *{min-width:0}
body{font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand);text-decoration:none}
svg{flex-shrink:0}
h1,h2,h3,p{margin:0}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:var(--bg);overflow-x:clip}
.screen{min-height:100vh;padding-bottom:calc(88px + var(--safe-bottom))}
.screen.no-nav{padding-bottom:calc(24px + var(--safe-bottom))}
.pad{padding:0 20px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bold{font-weight:700}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* top bars */
.hero{background:var(--brand);color:#fff;padding:calc(20px + var(--safe-top)) 20px 64px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:23px;line-height:1.4;font-weight:700}
.topbar{background:var(--card);padding:calc(14px + var(--safe-top)) 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;font-weight:700}
.page-title{padding:calc(22px + var(--safe-top)) 20px 14px}
.page-title h1{font-size:24px;font-weight:700}

/* buttons */
.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--field);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn.glass{background:rgba(255,255,255,.14);color:#fff}
.icon-btn.white{background:var(--card);box-shadow:0 2px 8px rgba(16,32,28,.10)}
.icon-btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px;font-weight:600;width:100%}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:active{background:var(--brand-dark)}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-dark{background:var(--inv);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);height:44px}
.btn-danger{background:transparent;color:var(--red);height:44px}
.btn[disabled]{opacity:.55;pointer-events:none}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line-strong);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* fields */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{height:52px;border:1.5px solid var(--line-strong);border-radius:14px;padding:0 14px;background:var(--card);outline:none;width:100%}
.input:focus{border-color:var(--brand)}
textarea.input{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
select.input{appearance:none}
.searchbox{display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;background:var(--field);padding:0 12px;color:var(--muted)}
.searchbox input{all:unset;flex:1;width:100%;min-width:0;color:var(--ink);font-size:15px}
.search-float{margin:-36px 20px 0;background:var(--card);border-radius:18px;box-shadow:0 8px 24px rgba(16,32,28,.10);padding:6px 6px 6px 8px;display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.search-float form{display:flex;align-items:center;gap:10px;flex:1;padding-right:12px;color:var(--muted)}
.search-float input{all:unset;flex:1;width:100%;min-width:0;height:44px;color:var(--ink);font-size:15px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.list-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;color:var(--ink);width:100%;text-align:right}
.avatar{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.badge{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.b-open{color:var(--brand);background:var(--brand-soft)}
.b-closed{color:var(--muted);background:var(--field)}
.b-low{color:var(--amber);background:var(--amber-soft)}
.b-out{color:var(--red);background:var(--red-soft)}
.b-rx{color:var(--blue);background:var(--blue-soft)}
.b-premium{color:var(--gold-ink);background:var(--gold-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:#12A27E;display:inline-block}
.b-closed .dot{background:var(--faint)}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 12px}
.section-head h2{font-size:17px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:22px 20px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink)}
.cat span{width:60px;height:60px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.empty{padding:36px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center}
.empty h3{color:var(--ink);font-size:16px}
.divider-list > *{border-bottom:1px solid var(--line-2)}
.divider-list > *:last-child{border-bottom:0}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(10px + var(--safe-bottom));display:grid;z-index:30}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--muted);padding:6px 0;position:relative}
.nav a.on{color:var(--brand);font-weight:600}
.nav .pill{position:absolute;top:2px;left:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 50%,var(--sk1) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}

/* toast & sheet */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:var(--inv);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{background:var(--red)}
#toast.success{background:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(16,32,28,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + var(--safe-bottom));max-height:88vh;overflow:auto;animation:up .25s}
.sheet .grab{width:40px;height:5px;border-radius:999px;background:var(--line-strong);margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* map */
.map-full{position:fixed;inset:0;max-width:520px;margin:0 auto;z-index:1}
.map-top{position:fixed;top:calc(16px + var(--safe-top));left:0;right:0;max-width:520px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:10px;z-index:10}
.map-card{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-bottom));max-width:520px;margin:0 auto;padding:0 12px;z-index:10}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.pin svg{transform:rotate(45deg)}
.me-dot{width:20px;height:20px;border-radius:50%;background:#2563EB;border:4px solid #fff;box-shadow:0 0 0 9px rgba(37,99,235,.18)}
.leaflet-container{font-family:inherit;background:var(--map-bg)}

/* chat */
.msgs{display:flex;flex-direction:column;gap:6px;padding:16px}
.bubble{max-width:78%;padding:10px 14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.bubble.me{align-self:flex-start;background:var(--brand);color:#fff;border-radius:18px 18px 4px 18px}
.bubble.them{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px}
.bubble img{display:block;max-width:220px;max-height:260px;border-radius:12px;margin:-4px -8px}
.stamp{font-size:11px;color:var(--muted);margin-bottom:6px}
.stamp.me{align-self:flex-start}.stamp.them{align-self:flex-end}
.composer{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(12px + var(--safe-bottom));display:flex;align-items:center;gap:8px;z-index:30}
.composer input[type=text]{flex:1;height:44px;border-radius:13px;background:var(--field);border:0;padding:0 14px;outline:none}

/* segmented */
.seg{display:flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on-ok{background:var(--card);color:var(--brand)}
.seg button.on-low{background:var(--card);color:var(--amber)}
.seg button.on-out{background:var(--card);color:var(--red)}

.toggle-card{border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px;color:#fff;width:100%;text-align:right}
.switch{width:64px;height:36px;border-radius:999px;background:rgba(255,255,255,.25);position:relative}
.switch i{position:absolute;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps span{height:5px;border-radius:999px;background:var(--line)}
.steps span.on{background:var(--brand)}
.drop{border:2px dashed var(--drop-line);border-radius:18px;background:var(--drop-bg);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--brand);text-align:center;padding:16px;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 0;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent}
.tabs button.on{color:var(--brand);font-weight:700;border-color:var(--brand)}
.stars{display:inline-flex;gap:2px;direction:ltr}
.star-pick{display:flex;gap:6px;justify-content:center;direction:ltr}
.star-pick button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.notice{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--amber-soft);color:var(--warn-ink)}
.notice.info{background:var(--blue-soft);color:#1E3A8A}
.notice.ok{background:var(--brand-soft);color:var(--brand-dark)}
</style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="logo"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#0B6E5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><path d="M12 6.5v6M9 9.5h6"/></svg></div>
  <div class="name">حبّة</div><div class="tag">دواؤك أقرب مما تتوقع</div>

</div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/leaflet.js"></script>
<script>

function locErrText(e) {
  const m = String((e && (e.message || e.code)) || e || '').toLowerCase();
  if (m.includes('not enabled') || m.includes('disabled') || m.includes('services')) return 'خدمة الموقع (GPS) مغلقة في هاتفك. افتحها من الإعدادات السريعة.';
  if (m.includes('denied') || m.includes('permission') || m === '1') return 'لم تسمح للتطبيق بالوصول إلى موقعك. اسمح به من إعدادات التطبيق ← الأذونات ← الموقع.';

// المحاولة 1: إضافة Capacitor (GPS عالي الدقة، أفضل قراءة خلال ثوانٍ)
function watchBest(watchFn, clearFn, maxWait) {
  return new Promise((resolve, reject) => {
    let best = null, id = null, done = false, lastErr = null;
    const finish = () => {
      if (done) return; done = true; clearTimeout(timer);
      if (id != null) { try { clearFn(id); } catch {} }
      best ? resolve(best) : reject(lastErr || new Error('timeout'));
    };
    const onPos = (pos) => {
      if (!pos || !pos.coords) return;
      const c = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 9999), t: Date.now() };
      if (!best || c.acc < best.acc) best = c;
      if (best.acc <= LOC_GOOD_ACC) finish();
    };
    const onErr = (e) => { lastErr = e; const m = String((e && e.message) || '').toLowerCase(); if (!best && (m.includes('denied') || m.includes('not enabled') || (e && e.code === 1))) finish(); };
    const timer = setTimeout(finish, maxWait);
    try {
      const r = watchFn(onPos, onErr);
      if (r && r.then) r.then(v => { id = v; if (done) { try { clearFn(v); } catch {} } }).catch(e => { lastErr = e; finish(); });
      else id = r;
    } catch (e) { lastErr = e; finish(); }
  });
}
function oneShot(getFn, ms = 6000) {
  return new Promise((resolve, reject) => {
    setTimeout(() => reject(new Error('timeout')), ms); // بعض الأجهزة لا تستدعي الخطأ أبداً
    try {
      const r = getFn(pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 9999), t: Date.now() }), reject);
      if (r && r.then) r.then(pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 9999), t: Date.now() })).catch(reject);
    } catch (e) { reject(e); }
  });
}

async function locateBest(maxWait = 12000) {
  const G = isNative && Plug('Geolocation');
  const hi = { enableHighAccuracy: true, timeout: maxWait, maximumAge: 0 };
  const lo = { enableHighAccuracy: false, timeout: 5000, maximumAge: 600000 };
  const errs = [];
  if (G) {
    try {
      const p = await G.checkPermissions();
      if (p.location !== 'granted' && p.coarseLocation !== 'granted') {
        const r = await G.requestPermissions();
        if (r.location !== 'granted' && r.coarseLocation !== 'granted') throw new Error('permission denied');
      }
    } catch (e) { errs.push(e); if (String(e.message || '').toLowerCase().includes('denied')) { lastLocErr = locErrText(e); throw e; } }
    // GPS عالي الدقة
    try { return await watchBest((ok, bad) => G.watchPosition(hi, (pos, err) => err ? bad(err) : ok(pos)), (id) => G.clearWatch({ id }), maxWait); } catch (e) { errs.push(e); }
    // موقع الشبكة (يعمل داخل المباني)
    try { return await oneShot(() => G.getCurrentPosition(lo)); } catch (e) { errs.push(e); }
  }
  // المحاولة 3: موقع متصفح WebView
  if (navigator.geolocation) {
    try { return await watchBest((ok, bad) => navigator.geolocation.watchPosition(ok, bad, hi), (id) => navigator.geolocation.clearWatch(id), G ? 5000 : maxWait); } catch (e) { errs.push(e); }
    try { return await oneShot((ok, bad) => navigator.geolocation.getCurrentPosition(ok, bad, lo)); } catch (e) { errs.push(e); }
  }
  const e = errs.find(x => /not enabled|denied|permission/i.test(String(x && x.message))) || errs[0] || new Error('no geo');
  lastLocErr = locErrText(e);
  console.warn('location failed', errs.map(x => x && (x.message || x.code)));
  throw e;
}

// اسم الحي والمدينة من OpenStreetMap (بالعربية)
async function placeName(c) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${c.lat}&lon=${c.lng}&zoom=16&accept-language=ar`);
    const j = await r.json(), a = j.address || {};
    const area = a.neighbourhood || a.suburb || a.quarter || a.residential || a.road || '';
    const city = a.city || a.town || a.village || a.state || '';
    return [area, city].filter(Boolean).filter((v, i, x) => x.indexOf(v) === i).join('، ');
  } catch { return ''; }
}

async function getCoords(force = false) {
  if (!force && !S.coords) {
    const saved = await kv.get('coords');
    if (saved) { try { S.coords = JSON.parse(saved); S.coordsReal = true; } catch {} }
  }
  if (!force && S.coords && S.coordsReal) {
    if (!S.coords.manual && Date.now() - (S.coords.t || 0) >= LOC_MAX_AGE) refreshInBackground();
    return S.coords;
  }
  try {
    await saveCoords(await locateBest(force ? 10000 : 6000));
    S.lastLocOk = true;
    if (force) toast(`تم تحديد موقعك بدقة ${S.coords.acc} م`, 'success');
  } catch {
    S.lastLocOk = false;
    S.coords = S.coords || { ...DEFAULT_COORDS };
    if (force) locationSheet(lastLocErr);
  }
  return S.coords;
}

let cleanups = [], renderSeq = 0;
function onCleanup(fn) { cleanups.push(fn); }
function go(path, params) {
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  location.hash = path + qs;
}
function parseHash() {
  const h = location.hash.slice(1) || '/home';
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', id: parts[1], query: Object.fromEntries(new URLSearchParams(qs || '')) };
}
async function render() {
  cleanups.forEach(fn => { try { fn(); } catch {} }); cleanups = [];
  closeSheet();
  const seq = ++renderSeq;
  const r = parseHash();
  const screen = Screens[r.name] || Screens.home;
  const app = $('#app');
  app.innerHTML = skeleton();
  try {
    const out = await screen(r);
    if (seq !== renderSeq || !out) return;
    app.innerHTML = out.html;
    window.scrollTo(0, 0);
    hideBoot();
    if (out.mount) out.mount();
  } catch (e) {
    console.error(e);
    if (seq !== renderSeq) return;
    hideBoot();
    app.innerHTML = `<div class="screen no-nav">${topbar('خطأ')}${emptyState('wifiOff', 'تعذّر تحميل الصفحة', errMsg(e), `<button class="btn btn-primary" style="max-width:220px" onclick="render()">إعادة المحاولة</button>`)}</div>`;

}

const BIO_SERVER = 'sydaliati.sudan';
const Bio = {
  get p() { return isNative ? Plug('NativeBiometric') : null; },
  async available() {
    if (!this.p) return false;
    try { const r = await this.p.isAvailable(); return !!(r && r.isAvailable); } catch { return false; }
  },
  async verify(reason) {
    await this.p.verifyIdentity({ reason, title: 'حبّة', subtitle: reason, description: '', negativeButtonText: 'إلغاء', maxAttempts: 3 });
  },
  async save(email, password) { await this.p.setCredentials({ username: email, password, server: BIO_SERVER }); await kv.set('bio_email', email); },
  async load() { return this.p.getCredentials({ server: BIO_SERVER }); },
  async clear() { try { if (this.p) await this.p.deleteCredentials({ server: BIO_SERVER }); } catch {} await kv.remove('bio_email'); },
  async email() { return this.p ? await kv.get('bio_email') : null; }
};
const FINGER = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>';

function bioErr(e) {
  const m = String((e && e.message) || '').toLowerCase(), code = String((e && e.code) || '');
  if (m.includes('cancel') || ['10', '13', '16'].includes(code)) return null; // ألغاه المستخدم
  return 'تعذّر التحقق من البصمة';
}

// بعد الدخول بكلمة المرور: نعرض تفعيل البصمة مرة واحدة
async function offerBiometric(email, password, then) {
  if (!(await Bio.available()) || (await Bio.email()) === email || (await kv.get('bio_asked_' + email))) return then();
  await kv.set('bio_asked_' + email, '1');
  openSheet(`<div class="empty" style="padding:6px 0 0"><div class="ic">${FINGER}</div><h3>الدخول بالبصمة</h3>
    <p class="small" style="line-height:1.8">ادخل في المرات القادمة ببصمتك بدل كتابة كلمة المرور.</p></div>
    <div class="stack" style="gap:8px;margin-top:16px"><button class="btn btn-primary" id="bioOn">تفعيل البصمة</button><button class="btn btn-ghost" id="bioLater">لاحقاً</button></div>`, (o) => {
    let done = false; const finish = () => { if (done) return; done = true; closeSheet(); then(); };
    o.addEventListener('click', (e) => { if (e.target === o) finish(); });
    $('#bioLater').addEventListener('click', finish);
    $('#bioOn').addEventListener('click', async () => {
      try { await Bio.verify('أكّد بصمتك لتفعيل الدخول السريع'); await Bio.save(email, password); toast('تم تفعيل الدخول بالبصمة', 'success'); finish(); }
      catch (e) { const m = bioErr(e); if (m) toast(m, 'error'); }
    });
  });
}

function groupProducts(rows) {

  for (const p of rows) {
    const key = p.generic_en || p.generic || p.name;
    if (!m.has(key)) m.set(key, { key, title: p.generic || p.name, en: p.generic_en, brands: p.brands, rx: p.rx, match: p.match, cat: p.category, items: [] });
    const g = m.get(key);
    if (!g.match && p.match) g.match = p.match;
    const label = [p.strength, p.form ? (FORMS.find(f => f[0] === p.form) || [, p.form])[1] : ''].filter(Boolean).join(' ') || p.name;
    g.items.push({ id: p.id, label, pending: p.status === 'pending' });
  }
  return [...m.values()];
}
const brandsShort = (b) => b ? esc(b.split(',').map(x => x.trim()).filter(Boolean).slice(0, 3).join('، ')) : '';
function groupCard(g, chip) {
  const matchCls = !g.match ? '' : g.match.startsWith('يُستخدم') ? 'b-low' : g.match === 'هل تقصد؟' ? 'b-closed' : 'b-open';
  return `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
    <div class="row" style="align-items:flex-start">
      <span style="width:40px;height:40px;border-radius:12px;background:var(--field);color:var(--brand);display:flex;align-items:center;justify-content:center">${icon(catIcon({ category: g.cat }), 19, 1.8)}</span>
      <span class="grow col" style="gap:2px"><b style="font-size:15px">${esc(g.title)}</b>
        ${g.en || g.brands ? `<span class="small muted" style="line-height:1.6">${g.en ? `<span dir="ltr">${esc(g.en)}</span>` : ''}${g.en && g.brands ? ' · ' : ''}${brandsShort(g.brands)}</span>` : ''}</span>
      <span class="col" style="gap:4px;align-items:flex-end">${g.rx ? '<span class="badge b-rx">بوصفة</span>' : ''}${g.match ? `<span class="badge ${matchCls}">${esc(g.match)}</span>` : ''}</span>
    </div>
    <div class="chips" style="flex-wrap:wrap">${g.items.map(chip).join('')}</div></div>`;
}

Screens.search = async ({ query }) => {
  const cat = query.cat || '', cls = query.cls || '';
  const CAT = { '': 'الكل', medicine: 'أدوية', gloves: 'قفازات', supplies: 'مستلزمات' };
  const classes = await loadClasses();
  const clsName = cls ? ((classes.find(c => c.code === cls) || {}).name_ar || '') : '';
  return {
    html: `<div class="screen no-nav">
      <header class="topbar" style="flex-direction:column;align-items:stretch;gap:12px">
        <div class="row"><button class="icon-btn" aria-label="رجوع" onclick="goBack('/home')">${icon('back')}</button>
          <label class="searchbox grow" style="border:1.5px solid var(--brand)">${icon('search', 18, 2)}<input id="sq" value="${esc(query.q || '')}" placeholder="اسم تجاري، مادة فعالة، أو عرَض (مثل: صداع)" aria-label="بحث" enterkeyhint="search" autocomplete="off"></label></div>
        ${cls ? `<div class="row" style="justify-content:space-between"><b>${esc(clsName)}</b><a href="#/search" class="small bold">كل الفئات</a></div>` :
          `<div class="chips">${Object.entries(CAT).map(([k, v]) => `<button class="chip ${cat === k ? 'on' : ''}" data-cat="${k}">${v}</button>`).join('')}</div>`}
      </header>
      <div id="results" class="pad stack" style="padding-top:16px"></div></div>`,
    mount() {
      const input = $('#sq'), box = $('#results');
      let t, seq = 0;
      const chip = (it) => `<a class="chip" href="#/product/${it.id}" style="height:34px">${esc(it.label)}${it.pending ? ' · قيد المراجعة' : ''}</a>`;
      const browse = () => {
        const list = classes.filter(c => cat === 'gloves' ? c.code === 'gloves' : cat === 'supplies' ? ['supplies', 'devices', 'baby', 'iv'].includes(c.code) : cat === 'medicine' ? !['gloves', 'supplies', 'devices', 'baby'].includes(c.code) : true);
        box.innerHTML = `<p class="small muted">تصفّح حسب الفئة العلاجية، أو ابحث بالاسم التجاري أو العلمي أو العَرَض.</p>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${list.map((c, i) => { const [bg, fg] = TINTS[i % 5];
            return `<a href="#/search?cls=${c.code}" class="card" style="padding:14px;display:flex;align-items:center;gap:10px;color:var(--ink);min-height:64px">
              <span style="width:10px;height:10px;border-radius:50%;background:${fg};flex-shrink:0"></span><b style="font-size:13.5px;line-height:1.5">${esc(c.name_ar)}</b></a>`; }).join('')}</div>`;
      };
      const run = async () => {
        const term = input.value.trim(), my = ++seq;
        if (term.length < 2 && !cls) return browse();
        box.innerHTML = '<div class="sk" style="height:110px"></div>'.repeat(3);
        try {
          const rows = term.length >= 2
            ? await q(sb.rpc('smart_search', { q: term, cat: cat || null, lim: 80 }))
            : await q(sb.from('products').select('*').eq('class_code', cls).neq('status', 'rejected').order('pop', { ascending: false }).order('name').limit(400));
          if (my !== seq) return;
          const groups = groupProducts(cls && term.length >= 2 ? rows.filter(r => r.class_code === cls) : rows);
          const symptom = groups.some(g => g.match && g.match.startsWith('يُستخدم'));
          box.innerHTML = groups.length ? `${symptom ? `<div class="notice warn">${icon('shieldAlert', 18, 1.9)}<span>هذه أدوية تُستخدم عادةً لـ «${esc(term)}». اقتراحات عامة فقط، <b>استشر الصيدلي أو الطبيب</b> قبل استخدام أي دواء.</span></div>` : ''}
            <p class="small muted">${groups.length} مادة فعالة · ${rows.length} شكل وتركيز</p>${groups.map(g => groupCard(g, chip)).join('')}` :
            emptyState('search', 'لم نجد هذا الصنف', 'جرّب الاسم العلمي أو اسماً آخر، أو اسأل الصيدلية مباشرة عبر الدردشة.');
        } catch (e) { if (my === seq) box.innerHTML = emptyState('wifiOff', 'تعذّر البحث', errMsg(e)); }
      };
      input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 280); });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(t); run(); input.blur(); } });
      document.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => {
        const p = {}; if (input.value.trim()) p.q = input.value.trim(); if (b.dataset.cat) p.cat = b.dataset.cat;
        location.replace('#/search' + (Object.keys(p).length ? '?' + new URLSearchParams(p) : ''));
      }));
      run(); if (!query.q && !cls) input.focus();
    }
  };
};

function parseLoc(v) {
  if (!v) return null;
  if (typeof v === 'object' && v.coordinates) return { lng: v.coordinates[0], lat: v.coordinates[1] };
  if (typeof v === 'string') {
    const m = v.match(/POINT\s*\(\s*([-\d.]+)\s+([-\d.]+)/i);
    if (m) return { lng: +m[1], lat: +m[2] };
    if (/^[0-9A-F]+$/i.test(v) && v.length >= 42) { // WKB hex (EWKB مع SRID)
      const hex = v.length === 50 ? v.slice(18) : v.slice(10);
      const rd = (h) => { const b = new DataView(new ArrayBuffer(8)); for (let i = 0; i < 8; i++) b.setUint8(i, parseInt(h.substr(i * 2, 2), 16)); return b.getFloat64(0, true); };
      return { lng: rd(hex.slice(0, 16)), lat: rd(hex.slice(16, 32)) };
    }
  }
  return null;
}
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function compressImage(file, maxSide, quality) {

    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error('compress')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:500;pointer-events:none"><div class="pin" style="width:44px;height:44px;background:var(--brand)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></div></div>
      <span style="position:absolute;bottom:10px;right:10px;left:10px;background:var(--card);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--ink-2);z-index:500">حرّك الخريطة حتى يكون الدبوس على مدخل الصيدلية</span>
    </div>
    <button class="btn" id="r-me" style="height:48px;background:var(--blue-soft);color:var(--blue);font-size:14px">${icon('locate', 18, 2)}أنا داخل الصيدلية الآن — استخدم موقعي</button>
    <div class="field"><label for="r-addr">وصف العنوان</label><input class="input" id="r-addr" value="${esc(d.address || '')}" placeholder="مثال: شارع المطار، بجوار مسجد الهدى" maxlength="140"></div>`;
  if (step === 3) body = `
    <p style="font-size:14px;color:var(--ink-2);line-height:1.8">نراجع الترخيص يدوياً لحماية المستخدمين. بعد الموافقة تظهر صيدليتك للعملاء بشارة <b style="color:var(--brand)">موثقة</b>.</p>

      `<span style="width:56px;height:56px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(11,110,91,.12)">${icon('upload', 26, 1.8)}</span><b>ارفع صورة ترخيص الصيدلية</b><span class="small muted">صورة واضحة أو PDF · حتى 5 ميغا</span>`}
      <input type="file" id="r-lic" accept="image/*,application/pdf" aria-label="صورة الترخيص"></label>
    <label class="list-card" style="position:relative;cursor:pointer">${icon('image', 22, 1.8)}<span class="grow col" style="gap:2px"><span class="bold" style="font-size:13.5px">${d.photo ? esc(d.photo.name) : 'صورة الصيدلية من الخارج (اختياري)'}</span><span class="small muted">تساعد العملاء على التعرّف عليها</span></span><span class="small bold" style="color:var(--brand)">${d.photo ? 'تغيير' : 'إضافة'}</span>

    <label class="row" style="align-items:flex-start;font-size:13px;line-height:1.7;color:var(--ink-2)"><input type="checkbox" id="r-pledge" ${d.pledge ? 'checked' : ''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--brand)">أتعهد بعدم صرف أدوية الوصفة دون روشتة، وبتحديث حالة الصيدلية والمخزون باستمرار</label>`;
  return {
    html: `<div class="screen no-nav" style="background:var(--card)">

          if (!d.loc) return toast('حدّد موقع الصيدلية على الخريطة', 'error');
          Reg.step = 3; return render();
        }
        if (!d.license) return toast('ارفع صورة الترخيص', 'error');
        if (!d.pledge) return toast('وافق على التعهد للمتابعة', 'error');
        const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
        try {
          const uid = S.user.id, ts = Date.now();
          let licFile = d.license, licType = d.license.type || 'application/octet-stream', ext = (d.license.name.split('.').pop() || 'jpg').toLowerCase();
          if (licType.startsWith('image/')) { licFile = await compressImage(d.license, 2000, 0.85); licType = 'image/jpeg'; ext = 'jpg'; }
          const licPath = `${uid}/license-${ts}.${ext}`;
          await q(sb.storage.from('licenses').upload(licPath, licFile, { contentType: licType }));
          let photoPath = null;
          if (d.photo) {
            photoPath = `${uid}/photo-${ts}.jpg`;
            await q(sb.storage.from('pharmacy-photos').upload(photoPath, await compressImage(d.photo, 1400, 0.8), { contentType: 'image/jpeg' }));
          }
          await q(sb.from('pharmacies').insert({
            owner_id: uid, name: d.name, phone: d.phone, whatsapp: d.whatsapp || null, address: d.address || null, city: d.city,
            location: `SRID=4326;POINT(${d.loc.lng} ${d.loc.lat})`, opens_at: d.opens_at || null, closes_at: d.closes_at || null,
            night_shift: !!d.night_shift, is_open: false, license_path: licPath, photo_path: photoPath
          }));
          Reg.step = 1; Reg.data = {};
          await loadSession();
          toast('تم الإرسال! سنراجع الترخيص قريباً', 'success');
          location.replace('#/owner');
        } catch (err) { console.error(err); toast(errMsg(err), 'error'); btn.disabled = false; btn.textContent = 'إرسال للمراجعة'; }
      });
    }
  };
};

          <span class="switch"><i style="left:${p.is_open ? '4px' : '32px'}"></i></span></button>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">

          ${stat('pill', '#1D4ED8', inv.length, 'صنف في المخزون')}
          ${stat('star', '#B54708', p.rating_count ? p.rating_avg : '—', `${p.rating_count} تقييم`)}
        </div>
        ${p.verified ? premiumCard : ''}
        <div class="row" style="justify-content:space-between;margin-top:4px"><h2 style="font-size:16px">المخزون والأسعار</h2>
          <button class="row small bold" id="addItem" style="color:var(--brand);min-height:44px;gap:4px">${icon('plus', 18, 2)}إضافة صنف</button></div>
        ${inv.length ? `<div class="card divider-list" style="padding:0 14px">${inv.map(r => `<div style="padding:12px 0" class="col">
          <div class="row"><span class="grow bold ellipsis" style="font-size:14px">${esc(r.products.name)}</span>
            <span class="seg">${segBtn(r, 'ok', 'متوفر')}${segBtn(r, 'low', 'قليل')}${segBtn(r, 'out', 'نفد')}</span></div>
          <div class="row" style="gap:8px"><label class="small muted" for="pr-${r.product_id}">السعر</label>
            <input id="pr-${r.product_id}" data-price="${r.product_id}" class="input" inputmode="decimal" dir="ltr" value="${r.price ?? ''}" placeholder="—" style="height:38px;width:120px;border-radius:10px;font-size:14px;text-align:right">
            <span class="small muted grow">ج.س</span><span class="small muted">${ago(r.updated_at)}</span>
            <button class="icon-btn" data-del="${r.product_id}" aria-label="حذف الصنف" style="width:38px;height:38px;background:none;color:var(--faint)">${icon('x', 16, 2)}</button></div></div>`).join('')}</div>
          <p class="small muted" style="line-height:1.7">كل تغيير يُحفظ فوراً ويظهر للعملاء مع وقت التحديث.</p>` :
        emptyState('pill', 'مخزونك فارغ', 'أضف الأصناف المتوفرة لديك ليجدك العملاء عند البحث عنها.', `<button class="btn btn-primary" id="addItem2" style="max-width:220px">${icon('plus', 18, 2)}إضافة أول صنف</button>`)}
      </div>${nav('/owner')}</div>`,
    mount() {
      $('#openT').addEventListener('click', async () => {
        try { await q(sb.from('pharmacies').update({ is_open: !p.is_open }).eq('id', p.id)); toast(p.is_open ? 'أصبحت الصيدلية مغلقة' : 'أصبحت الصيدلية مفتوحة', 'success'); render(); }
        catch (e) { toast(errMsg(e), 'error'); }
      });
      document.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', async () => {
        const pid = b.dataset.pid, st = b.dataset.st;
        try {
          await q(sb.from('inventory').update({ status: st }).eq('pharmacy_id', p.id).eq('product_id', pid));
          b.parentElement.querySelectorAll('button').forEach(x => { x.className = x.dataset.st === st ? 'on-' + st : ''; x.setAttribute('aria-pressed', x.dataset.st === st); });
        } catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-price]').forEach(inp => inp.addEventListener('change', async () => {
        const v = inp.value.replace(/[,\s]/g, '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        const price = v === '' ? null : Number(v);
        if (price != null && (isNaN(price) || price < 0)) return toast('أدخل سعراً صحيحاً', 'error');
        try { await q(sb.from('inventory').update({ price }).eq('pharmacy_id', p.id).eq('product_id', inp.dataset.price)); toast('تم حفظ السعر', 'success'); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        try { await q(sb.from('inventory').delete().eq('pharmacy_id', p.id).eq('product_id', b.dataset.del)); render(); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      const add = () => addItemSheet(p.id, new Set(inv.map(r => r.product_id)));
      ['#addItem', '#addItem2'].forEach(s => { const el = $(s); if (el) el.addEventListener('click', add); });
    }
  };
};
function addItemSheet(pharmacyId, existing) {
  let dirty = false, tab = 'search';
  const addOne = async (pid) => {
    await q(sb.from('inventory').insert({ pharmacy_id: pharmacyId, product_id: pid, status: 'ok' }));
    existing.add(pid); dirty = true;
  };
  const chip = (it) => existing.has(it.id)
    ? `<span class="chip" style="height:34px;background:var(--brand-soft);border-color:transparent;color:var(--brand)">${icon('check', 14, 2.4)}${esc(it.label)}</span>`
    : `<button class="chip" data-add="${it.id}" style="height:34px">${icon('plus', 14, 2.4)}${esc(it.label)}</button>`;
  const bindAdds = (root) => root.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try { await addOne(b.dataset.add); b.outerHTML = `<span class="chip" style="height:34px;background:var(--brand-soft);border-color:transparent;color:var(--brand)">${icon('check', 14, 2.4)}${b.textContent}</span>`; }
    catch (e) { b.disabled = false; toast(errMsg(e), 'error'); }
  }));
  openSheet(`<h3>إضافة أصناف لمخزونك</h3>
    <div class="tabs" style="margin-bottom:14px">${[['search', 'بحث'], ['class', 'حسب الفئة'], ['new', 'صنف جديد']].map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`).join('')}</div>
    <div id="aBody"></div>`, async (o) => {
    const body = $('#aBody');
    o.addEventListener('click', (e) => { if (e.target === o && dirty) render(); });
    const showSearch = () => {
      body.innerHTML = `<label class="searchbox" style="margin-bottom:12px">${icon('search', 18, 2)}<input id="aq" placeholder="اسم تجاري أو علمي (عربي أو إنجليزي)" autocomplete="off"></label>
        <div id="ares" class="stack" style="gap:10px;min-height:200px"><p class="small muted" style="line-height:1.8">اكتب أول حروف الاسم، مثلاً: <b dir="ltr">augm</b> أو <b>بنادول</b> أو <b>سيبرو</b>. الأخطاء الإملائية مقبولة.</p></div>`;
      const input = $('#aq'), box = $('#ares'); let t, seq = 0;
      input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(async () => {
        const term = input.value.trim(), my = ++seq; if (term.length < 2) return;
        try {
          const rows = await q(sb.rpc('smart_search', { q: term, cat: null, lim: 40 }));
          if (my !== seq) return;
          const groups = groupProducts(rows);
          box.innerHTML = groups.length ? groups.map(g => groupCard(g, chip)).join('') :
            `<div class="empty" style="padding:16px 0"><h3>لم نجده في الكتالوج</h3><button class="btn btn-soft" id="goNew" style="max-width:240px">${icon('plus', 18, 2)}أضفه كصنف جديد</button></div>`;
          bindAdds(box); const gn = $('#goNew'); if (gn) gn.addEventListener('click', () => switchTab('new', term));
        } catch (e) { box.innerHTML = `<p class="small muted">${errMsg(e)}</p>`; }
      }, 280); });
      input.focus();
    };
    const showClass = async () => {
      const classes = await loadClasses();
      body.innerHTML = `<div class="field" style="margin-bottom:12px"><label for="acls">اختر الفئة</label><select id="acls" class="input">${classes.map(c => `<option value="${c.code}">${esc(c.name_ar)}</option>`).join('')}</select></div>
        <button class="btn btn-soft" id="aTop" style="height:46px;font-size:14px;margin-bottom:12px">${icon('plus', 18, 2)}أضف الأصناف الأكثر شيوعاً في هذه الفئة</button>
        <div id="ares" class="stack" style="gap:10px"></div>`;
      let rows = [];
      const load = async () => {
        rows = await q(sb.from('products').select('*').eq('class_code', $('#acls').value).neq('status', 'rejected').order('pop', { ascending: false }).order('name').limit(400));
        $('#ares').innerHTML = groupProducts(rows).map(g => groupCard(g, chip)).join(''); bindAdds($('#ares'));
      };
      $('#acls').addEventListener('change', load);
      $('#aTop').addEventListener('click', async (e) => {
        const btn = e.currentTarget; btn.disabled = true;
        // أشهر الأشكال: أول شكلين لكل مادة فعالة شائعة
        const seen = {}, pick = rows.filter(p => p.pop > 0 && !existing.has(p.id) && ((seen[p.generic_en] = (seen[p.generic_en] || 0) + 1) <= 2)).slice(0, 25);
        if (!pick.length) { btn.disabled = false; return toast('أضفت كل الأصناف الشائعة في هذه الفئة'); }
        try {
          await q(sb.from('inventory').insert(pick.map(p => ({ pharmacy_id: pharmacyId, product_id: p.id, status: 'ok' }))));
          pick.forEach(p => existing.add(p.id)); dirty = true; toast(`أُضيف ${pick.length} صنفاً`, 'success'); btn.disabled = false; load();
        } catch (err) { btn.disabled = false; toast(errMsg(err), 'error'); }
      });
      load();
    };
    const showNew = async (prefill = '') => {
      const classes = await loadClasses();
      body.innerHTML = `<p class="small muted" style="line-height:1.8;margin-bottom:12px">يُضاف لمخزونك فوراً، ويظهر لكل الصيدليات بعد مراجعة المشرف.</p>
        <div class="stack" style="gap:12px">
          <div class="field"><label for="nN">اسم الصنف (تجاري أو علمي)</label><input id="nN" class="input" value="${esc(prefill)}" placeholder="مثال: Augmentin أو أوجمنتين"></div>
          <div class="field"><label for="nG">المادة الفعالة (اختياري)</label><input id="nG" class="input" placeholder="مثال: Amoxicillin + Clavulanic Acid"></div>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
            <div class="field"><label for="nS">التركيز</label><input id="nS" class="input" dir="ltr" placeholder="625mg"></div>
            <div class="field"><label for="nF">الشكل</label><select id="nF" class="input"><option value="">—</option>${FORMS.map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div></div>
          <div class="field"><label for="nC">الفئة</label><select id="nC" class="input"><option value="">—</option>${classes.map(c => `<option value="${c.code}">${esc(c.name_ar)}</option>`).join('')}</select></div>
          <label class="row" style="min-height:44px;font-size:14px"><input type="checkbox" id="nR" style="width:20px;height:20px;accent-color:var(--brand)">يحتاج وصفة طبية</label>
          <button class="btn btn-primary" id="nGo">${icon('plus', 18, 2)}إضافة لمخزوني</button></div>`;
      $('#nGo').addEventListener('click', async (e) => {
        const name = $('#nN').value.trim(); if (name.length < 2) return toast('اكتب اسم الصنف', 'error');
        const btn = e.currentTarget; btn.disabled = true;
        try {
          const pid = await q(sb.rpc('propose_product', { p_name: name, p_generic: $('#nG').value.trim() || null, p_form: $('#nF').value || null,
            p_strength: $('#nS').value.trim() || null, p_rx: $('#nR').checked, p_class: $('#nC').value || null, p_brands: null }));
          if (!existing.has(pid)) await addOne(pid);
          toast('أُضيف لمخزونك، وسيُراجع قبل ظهوره لبقية الصيدليات', 'success');
          dirty = true; closeSheet(); render();
        } catch (err) { btn.disabled = false; toast(String(err.message || '').includes('too many') ? 'وصلت للحد اليومي للأصناف الجديدة' : errMsg(err), 'error'); }
      });
    };
    const switchTab = (k, prefill) => {
      tab = k; o.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
      (k === 'search' ? showSearch : k === 'class' ? showClass : () => showNew(prefill || ''))();
    };
    o.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
    showSearch();
  });
}

Screens.upgrade = async () => {
  if (!requireLogin('/upgrade')) return null;
  await loadSession();
  const p = S.myPharmacy;
  if (!p) { location.replace('#/register'); return null; }
  const st = await q(sb.from('app_settings').select('*').eq('id', 1).single());
  const plans = [[1, 'شهر واحد', st.price_1], [3, '3 أشهر', st.price_3], [12, 'سنة كاملة', st.price_12]].filter(x => x[2] != null);
  const ready = st.bankak_account && plans.length;
  let months = plans.length ? plans[Math.min(1, plans.length - 1)][0] : 1, receipt = null;
  const perks = [['search', 'تظهر أولاً في نتائج البحث عن الأدوية'], ['map', 'تظهر أولاً في الخريطة والصيدليات القريبة'], ['crown', 'شارة "مميزة" بجانب اسم صيدليتك']];
  return {
    html: `<div class="screen no-nav" style="background:var(--card)">${topbar('صيدلية مميزة', { back: '/owner' })}
      <div class="pad stack" style="padding-top:18px;gap:18px">
        <div class="card" style="padding:16px;background:var(--gold-bg);border-color:var(--gold-line);display:flex;flex-direction:column;gap:12px">
          ${perks.map(([ic, t]) => `<div class="row" style="gap:12px"><span style="width:36px;height:36px;border-radius:11px;background:var(--gold-soft);color:var(--gold-ink);display:flex;align-items:center;justify-content:center">${icon(ic, 18, 2)}</span><span style="font-size:14px;font-weight:500">${t}</span></div>`).join('')}
        </div>
        ${isPremium(p) ? `<div class="notice ok">${icon('check', 18, 2)}<span>اشتراكك فعّال حتى <b>${fmtDate(p.plan_until)}</b>. أي مدة جديدة تُضاف إليه.</span></div>` : ''}
        ${!ready ? emptyState('clock', 'الاشتراكات غير متاحة بعد', 'نجهّز طرق الدفع حالياً، حاول لاحقاً.') : `
        <div class="col" style="gap:10px"><h2 style="font-size:16px">1. اختر المدة</h2>
          <div class="stack" style="gap:8px" role="radiogroup">${plans.map(([m, label, price]) => `<button class="list-card" data-m="${m}" role="radio" style="padding:14px 16px">
            <span class="grow col" style="gap:2px"><b>${label}</b>${m > 1 && st.price_1 ? `<span class="small" style="color:var(--brand)">توفّر ${fmtPrice(st.price_1 * m - price)} ج.س</span>` : ''}</span>
            <b style="font-size:16px">${fmtPrice(price)} <span class="small muted">ج.س</span></b></button>`).join('')}</div></div>
        <div class="col" style="gap:10px"><h2 style="font-size:16px">2. حوّل المبلغ عبر بنكك</h2>
          <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
            <div class="row" style="justify-content:space-between"><span class="small muted">المبلغ</span><b id="amt" style="font-size:18px"></b></div>
            <div class="row" style="justify-content:space-between"><span class="small muted">رقم الحساب</span>
              <button class="row bold" id="copyAcc" style="gap:6px;color:var(--brand);min-height:36px" dir="ltr">${esc(st.bankak_account)} ${icon('file', 16, 2)}</button></div>
            ${st.bankak_name ? `<div class="row" style="justify-content:space-between"><span class="small muted">اسم صاحب الحساب</span><b>${esc(st.bankak_name)}</b></div>` : ''}
            <div class="row" style="justify-content:space-between"><span class="small muted">في خانة التعليق اكتب</span><b>${esc(p.name)}</b></div>
          </div></div>
        <div class="col" style="gap:10px"><h2 style="font-size:16px">3. أرسل إثبات التحويل</h2>
          <div class="field"><label for="ref">رقم العملية في بنكك</label><input class="input" id="ref" dir="ltr" inputmode="numeric" placeholder="مثال: 20261022123456" style="text-align:right" maxlength="60"></div>
          <label class="drop" style="min-height:120px" id="rcBox">${icon('image', 26, 1.8)}<b>صورة إشعار التحويل</b><span class="small muted">لقطة شاشة من تطبيق بنكك</span><input type="file" id="rc" accept="image/*" aria-label="صورة الإشعار"></label>
        </div>
        <button class="btn btn-primary" id="payBtn">إرسال للمراجعة</button>
        <p class="small muted" style="text-align:center;line-height:1.7">نراجع التحويل ونفعّل الاشتراك خلال 24 ساعة.</p>`}
      </div></div>`,
    mount() {
      if (!ready) return;
      const pick = (m) => {
        months = m;
        document.querySelectorAll('[data-m]').forEach(b => { const on = +b.dataset.m === m; b.style.borderColor = on ? 'var(--brand)' : 'var(--line)'; b.style.boxShadow = on ? '0 0 0 1.5px var(--brand)' : 'none'; b.setAttribute('aria-checked', on); });
        $('#amt').textContent = fmtPrice(plans.find(x => x[0] === m)[2]) + ' ج.س';
      };
      document.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => pick(+b.dataset.m)));
      pick(months);
      $('#copyAcc').addEventListener('click', async () => { try { await navigator.clipboard.writeText(st.bankak_account); toast('نُسخ رقم الحساب', 'success'); } catch { toast(st.bankak_account); } });
      $('#rc').addEventListener('change', (e) => {
        receipt = e.target.files[0] || null;
        if (receipt) { const box = $('#rcBox'); box.firstChild.remove(); box.querySelector('b').textContent = receipt.name; box.style.borderColor = 'var(--brand)'; }
      });
      $('#payBtn').addEventListener('click', async (e) => {
        const ref = $('#ref').value.trim();
        if (ref.length < 3) return toast('أدخل رقم العملية', 'error');
        if (!receipt) return toast('أرفق صورة إشعار التحويل', 'error');
        const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
        try {
          const path = `${S.user.id}/receipt-${Date.now()}.jpg`;
          await q(sb.storage.from('receipts').upload(path, await compressImage(receipt, 1600, 0.85), { contentType: 'image/jpeg' }));
          await q(sb.from('payments').insert({ pharmacy_id: p.id, months, txn_ref: ref, receipt_path: path }));
          toast('وصلنا طلبك، سنراجعه قريباً', 'success');
          location.replace('#/owner');
        } catch (err) {
          const m = (err && err.message) || '';
          toast(m.includes('قيد المراجعة') ? 'لديك طلب قيد المراجعة بالفعل' : errMsg(err), 'error');
          btn.disabled = false; btn.textContent = 'إرسال للمراجعة';
        }
      });
    }
  };
};

    content = rows.length ? rows.map(r => `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><div class="col" style="gap:2px"><b>${esc(r.pharmacies ? r.pharmacies.name : '')}</b>

        <span class="small muted">رقم العملية: <b dir="ltr" style="color:var(--ink)">${esc(r.txn_ref)}</b></span></div>
        <span class="badge ${SL[r.status][1]}">${SL[r.status][0]}</span></div>
      <div class="row"><button class="btn btn-soft" style="height:44px;font-size:14px" data-rc="${esc(r.receipt_path)}">${icon('image', 18, 2)}الإيصال</button>
      ${r.status === 'pending' ? `<button class="btn" style="height:44px;font-size:14px;background:var(--red-soft);color:var(--red)" data-rej="${r.id}">رفض</button>
        <button class="btn btn-primary" style="height:44px;font-size:14px" data-ok="${r.id}">${icon('check', 18, 2)}قبول</button>` : ''}</div></div>`).join('') :
      emptyState('crown', 'لا توجد مدفوعات بعد', 'ستظهر هنا طلبات الترقية من الصيدليات.');
  } else if (tab === 'settings') {
    const st = await q(sb.from('app_settings').select('*').eq('id', 1).single());
    content = `<form id="setForm" class="card stack" style="padding:16px;gap:14px">
      <h2 style="font-size:16px">حساب بنكك لاستلام المدفوعات</h2>
      <div class="field"><label for="s-acc">رقم الحساب</label><input class="input" id="s-acc" dir="ltr" inputmode="numeric" value="${esc(st.bankak_account || '')}" style="text-align:right"></div>
      <div class="field"><label for="s-name">اسم صاحب الحساب</label><input class="input" id="s-name" value="${esc(st.bankak_name || '')}"></div>
      <h2 style="font-size:16px;margin-top:6px">أسعار الاشتراك المميز (ج.س)</h2>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <div class="field"><label for="s-p1">شهر</label><input class="input" id="s-p1" inputmode="decimal" dir="ltr" value="${st.price_1 ?? ''}"></div>
        <div class="field"><label for="s-p3">3 أشهر</label><input class="input" id="s-p3" inputmode="decimal" dir="ltr" value="${st.price_3 ?? ''}"></div>
        <div class="field"><label for="s-p12">سنة</label><input class="input" id="s-p12" inputmode="decimal" dir="ltr" value="${st.price_12 ?? ''}"></div></div>
      <p class="small muted" style="line-height:1.7">اترك خانة السعر فارغة لإخفاء تلك المدة.</p>
      <button class="btn btn-primary" type="submit">حفظ</button></form>`;
  } else if (tab === 'reports') {
    const rows = await q(sb.from('reports').select('*, pharmacies(id, name, verified)').order('created_at', { ascending: false }).limit(150));
    rows.sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1));
    const TG = { pharmacy: ['store', 'صيدلية'], chat: ['chat', 'محادثة'], app: ['shieldAlert', 'التطبيق'] };
    const openN = rows.filter(r => r.status === 'open').length;
    content = rows.length ? `<p class="small muted">${openN} بلاغ مفتوح من ${rows.length}</p>` + rows.map(r => {
      const why = REPORT_REASONS[r.reason || r.type] || r.type, tg = TG[r.target] || TG.pharmacy;
      return `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px;${r.status === 'resolved' ? 'opacity:.6' : ''}">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div class="col" style="gap:3px"><span class="row small muted" style="gap:6px">${icon(tg[0], 15, 2)}${tg[1]}${r.pharmacies ? ' · <b style="color:var(--ink)">' + esc(r.pharmacies.name) + '</b>' : ''}</span>
            <b style="font-size:14.5px">${esc(why)}</b>${r.note ? `<span style="font-size:13.5px;line-height:1.7;color:var(--ink-2)">«${esc(r.note)}»</span>` : ''}
            <span class="small muted">${ago(r.created_at)}</span></div>
          <span class="badge ${r.status === 'open' ? 'b-low' : 'b-open'}">${r.status === 'open' ? 'مفتوح' : 'تم الحل'}</span></div>
        ${r.status === 'open' ? `<div class="row" style="flex-wrap:wrap;gap:8px">
          ${r.chat_id ? `<a class="btn btn-soft" style="height:40px;font-size:13px;width:auto;padding:0 14px" href="#/chat/${r.chat_id}">${icon('eye', 16, 2)}عرض المحادثة</a>` : ''}
          ${r.pharmacies ? `<a class="btn btn-soft" style="height:40px;font-size:13px;width:auto;padding:0 14px" href="#/pharmacy/${r.pharmacies.id}">الصيدلية</a>` : ''}
          ${r.pharmacies && r.pharmacies.verified ? `<button class="btn" style="height:40px;font-size:13px;width:auto;padding:0 14px;background:var(--red-soft);color:var(--red)" data-suspend="${r.pharmacies.id}">إيقاف الصيدلية</button>` : ''}
          <button class="btn btn-primary" style="height:40px;font-size:13px;width:auto;padding:0 14px" data-resolve="${r.id}">${icon('check', 16, 2)}تم الحل</button></div>` : ''}
      </div>`; }).join('') : emptyState('flag', 'لا توجد بلاغات', 'ستظهر هنا بلاغات المستخدمين عن الصيدليات والمحادثات والتطبيق.');
  } else {
    const [pend, classes, total] = await Promise.all([
      q(sb.from('products').select('*').eq('status', 'pending').order('created_at', { ascending: false }).limit(100)),
      loadClasses(),
      sb.from('products').select('id', { count: 'exact', head: true }).eq('status', 'approved')
    ]);
    content = `<p class="small muted">${total.count || 0} صنف في الكتالوج</p>
      <div class="col" style="gap:8px"><h2 style="font-size:16px">أصناف أضافها الصيادلة (${pend.length})</h2>
      ${pend.length ? `<div class="card divider-list" style="padding:0 14px">${pend.map(p => `<div class="col" style="padding:12px 0;gap:8px">
        <div class="col" style="gap:2px"><b>${esc(p.name)}</b><span class="small muted">${esc([p.generic, p.class_code ? (classes.find(c => c.code === p.class_code) || {}).name_ar : '', p.rx ? 'بوصفة' : ''].filter(Boolean).join(' · '))} · ${ago(p.created_at)}</span></div>
        <div class="row"><button class="btn" style="height:40px;font-size:13px;background:var(--red-soft);color:var(--red)" data-prej="${p.id}">رفض</button>
          <button class="btn btn-primary" style="height:40px;font-size:13px" data-pok="${p.id}">${icon('check', 16, 2)}اعتماد للجميع</button></div></div>`).join('')}</div>` :
        `<div class="card small muted" style="padding:14px;text-align:center">لا توجد أصناف بانتظار المراجعة</div>`}</div>
      <form id="prodForm" class="card stack" style="padding:16px;gap:12px"><h2 style="font-size:16px">إضافة صنف للكتالوج</h2>
        <div class="field"><label for="p-gen">المادة الفعالة بالعربي</label><input class="input" id="p-gen" required placeholder="مثال: أموكسيسيلين"></div>
        <div class="field"><label for="p-en">بالإنجليزي</label><input class="input" id="p-en" dir="ltr" placeholder="Amoxicillin"></div>
        <div class="field"><label for="p-br">الأسماء التجارية (افصل بفاصلة)</label><input class="input" id="p-br" placeholder="Amoxil اموكسيل, Ospamox"></div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
          <div class="field"><label for="p-st">التركيز</label><input class="input" id="p-st" dir="ltr" placeholder="500mg"></div>
          <div class="field"><label for="p-fm">الشكل</label><select class="input" id="p-fm"><option value="">—</option>${FORMS.map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div></div>
        <div class="field"><label for="p-cl">الفئة العلاجية</label><select class="input" id="p-cl">${classes.map(c => `<option value="${c.code}">${esc(c.name_ar)}</option>`).join('')}</select></div>
        <label class="row" style="min-height:44px;font-size:14px"><input type="checkbox" id="p-rx" style="width:20px;height:20px;accent-color:var(--brand)">يحتاج وصفة طبية</label>
        <button class="btn btn-primary" type="submit">${icon('plus', 18, 2)}إضافة للكتالوج</button></form>`;
  }
  const tabs = [['pending', 'التوثيق'], ['payments', 'المدفوعات'], ['reports', 'البلاغات'], ['catalog', 'الكتالوج'], ['settings', 'الإعدادات']];
  return {
    html: `<div class="screen no-nav">${topbar('لوحة المشرف', { back: '/account' })}
      <div class="pad" style="padding-top:12px"><div class="chips">${tabs.map(([k, v]) => `<a class="chip ${tab === k ? 'on' : ''}" href="#/admin?tab=${k}">${v}</a>`).join('')}</div></div>
      <div class="pad stack" style="padding-top:16px">${content}</div></div>`,
    mount() {
      document.querySelectorAll('[data-lic]').forEach(b => b.addEventListener('click', async () => {
        if (!b.dataset.lic) return toast('لا يوجد ترخيص مرفوع', 'error');
        try { const d = await q(sb.storage.from('licenses').createSignedUrl(b.dataset.lic, 600)); openExternal(d.signedUrl); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-verify]').forEach(b => b.addEventListener('click', async () => {
        try { await q(sb.from('pharmacies').update({ verified: true }).eq('id', b.dataset.verify)); toast('تم توثيق الصيدلية', 'success'); render(); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-rc]').forEach(b => b.addEventListener('click', async () => {
        try { const d = await q(sb.storage.from('receipts').createSignedUrl(b.dataset.rc, 600)); openExternal(d.signedUrl); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-ok]').forEach(b => b.addEventListener('click', async () => {
        b.disabled = true;
        try { await q(sb.rpc('review_payment', { pay_id: +b.dataset.ok, approve: true })); toast('تم تفعيل الاشتراك المميز', 'success'); render(); }
        catch (e) { b.disabled = false; toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-rej]').forEach(b => b.addEventListener('click', () => {
        openSheet(`<h3>سبب الرفض</h3><div class="field" style="margin-bottom:16px"><label for="rjn">يظهر للصيدلي</label><input id="rjn" class="input" placeholder="مثال: لم يصل التحويل / المبلغ ناقص" maxlength="140"></div><button class="btn" id="rjGo" style="background:var(--red);color:#fff">رفض الطلب</button>`, () => {
          $('#rjGo').addEventListener('click', async () => {
            try { await q(sb.rpc('review_payment', { pay_id: +b.dataset.rej, approve: false, note: $('#rjn').value.trim() || null })); closeSheet(); toast('تم رفض الطلب'); render(); }
            catch (e) { toast(errMsg(e), 'error'); }
          });
        });
      }));
      const sf = $('#setForm');
      if (sf) sf.addEventListener('submit', async (e) => {
        e.preventDefault();
        const num = (id) => { const v = $(id).value.replace(/[,\s]/g, '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)); return v === '' ? null : Number(v); };
        const row = { bankak_account: $('#s-acc').value.trim() || null, bankak_name: $('#s-name').value.trim() || null,
          price_1: num('#s-p1'), price_3: num('#s-p3'), price_12: num('#s-p12'), updated_at: new Date().toISOString() };
        if ([row.price_1, row.price_3, row.price_12].some(v => v != null && (isNaN(v) || v <= 0))) return toast('أدخل أسعاراً صحيحة', 'error');
        try { await q(sb.from('app_settings').update(row).eq('id', 1)); toast('تم الحفظ', 'success'); }
        catch (err) { toast(errMsg(err), 'error'); }
      });
      document.querySelectorAll('[data-resolve]').forEach(b => b.addEventListener('click', async () => {
        try { await q(sb.from('reports').update({ status: 'resolved', resolved_at: new Date().toISOString() }).eq('id', b.dataset.resolve)); toast('أُغلق البلاغ', 'success'); render(); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-suspend]').forEach(b => b.addEventListener('click', () => {
        openSheet(`<h3>إيقاف الصيدلية؟</h3><p class="small muted" style="line-height:1.8;margin-bottom:16px">ستختفي من البحث والخريطة حتى توثّقها من جديد من تبويب "التوثيق".</p><button class="btn" id="susGo" style="background:var(--red);color:#fff">إيقاف</button>`, () => {
          $('#susGo').addEventListener('click', async () => {
            try { await q(sb.from('pharmacies').update({ verified: false }).eq('id', b.dataset.suspend)); closeSheet(); toast('أُوقفت الصيدلية'); render(); }
            catch (e) { toast(errMsg(e), 'error'); }
          });
        });
      }));
      document.querySelectorAll('[data-pok]').forEach(b => b.addEventListener('click', async () => {
        try { await q(sb.from('products').update({ status: 'approved' }).eq('id', b.dataset.pok)); toast('اعتُمد الصنف للجميع', 'success'); render(); } catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-prej]').forEach(b => b.addEventListener('click', async () => {
        try { await q(sb.from('products').update({ status: 'rejected' }).eq('id', b.dataset.prej)); toast('رُفض الصنف'); render(); } catch (e) { toast(errMsg(e), 'error'); }
      }));
      const f = $('#prodForm');
      if (f) f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const gen = $('#p-gen').value.trim(); if (!gen) return;
        const en = $('#p-en').value.trim(), st = $('#p-st').value.trim(), fm = $('#p-fm').value, cl = $('#p-cl').value;
        const fAr = fm ? FORMS.find(x => x[0] === fm)[1] : '';
        const catOf = cl === 'gloves' ? 'gloves' : ['supplies', 'devices', 'iv', 'baby'].includes(cl) ? 'supplies' : 'medicine';
        try {
          await q(sb.from('products').insert({ name: [gen, st, fAr].filter(Boolean).join(' '), name_en: en ? [en, st].filter(Boolean).join(' ') : null,
            generic: gen, generic_en: en || null, brands: $('#p-br').value.trim() || null, strength: st || null, form: fm || null,
            class_code: cl, category: catOf, rx: $('#p-rx').checked, status: 'approved' }));
          toast('أُضيف الصنف', 'success'); f.reset();
        } catch (err) { toast(errMsg(err), 'error'); }
      });
    }
  };
};

/* ---------- الروابط الخارجية (خرائط، واتساب، ملفات) ---------- */
function openExternal(url) {
  if (isNative) location.href = url; // Capacitor يفتحها في التطبيق المناسب (خرائط جوجل، واتساب، المتصفح)
  else window.open(url, '_blank', 'noopener');
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[target="_blank"]');
  if (!a) return;
  e.preventDefault(); openExternal(a.href);
});

/* ---------- التشغيل ---------- */
(async function boot() {
  const SBar = isNative && Plug('StatusBar');
  if (SBar) { try { await SBar.setBackgroundColor({ color: '#0B6E5B' }); await SBar.setStyle({ style: 'DARK' }); } catch {} }
  const App = isNative && Plug('App');
  if (App) App.addListener('backButton', () => {
    if ($('#sheet')) return closeSheet();
    const n = parseHash().name;
    if (n === 'home' || n === 'login') App.exitApp(); else history.back();
  });
  await loadSession();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' || ev === 'TOKEN_REFRESHED') loadSession(); });
  refreshUnread();
  const first = await kv.get('seen_intro');
  if (!S.user && !first && !location.hash) { await kv.set('seen_intro', '1'); location.replace('#/login'); }
  render();
})();
</script>
</body>
</html>
