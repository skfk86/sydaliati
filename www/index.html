<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B6E5B">
<title>صيدليتي السودان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --brand:#0B6E5B; --brand-dark:#08513F; --brand-soft:#E3F2EC; --brand-mint:#7FD4BA;
  --ink:#10201C; --ink-2:#3B4A46; --muted:#5B6B67; --faint:#8A9894;
  --line:#E3E9E7; --line-2:#EEF2F1; --field:#F0F4F3; --bg:#F5F7F6; --card:#FFFFFF;
  --blue:#1D4ED8; --blue-soft:#E6EEFD; --amber:#B54708; --amber-soft:#FEF0E1;
  --red:#B42318; --red-soft:#FDE8E8; --gold:#F59E0B;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand);text-decoration:none}
svg{flex-shrink:0}
h1,h2,h3,p{margin:0}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
.screen{min-height:100vh;padding-bottom:calc(88px + var(--safe-bottom))}
.screen.no-nav{padding-bottom:calc(24px + var(--safe-bottom))}
.pad{padding:0 20px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bold{font-weight:700}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* top bars */
.hero{background:var(--brand);color:#fff;padding:calc(20px + var(--safe-top)) 20px 64px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:23px;line-height:1.4;font-weight:700}
.topbar{background:var(--card);padding:calc(14px + var(--safe-top)) 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;font-weight:700}
.page-title{padding:calc(22px + var(--safe-top)) 20px 14px}
.page-title h1{font-size:24px;font-weight:700}

/* buttons */
.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--field);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn.glass{background:rgba(255,255,255,.14);color:#fff}
.icon-btn.white{background:#fff;box-shadow:0 2px 8px rgba(16,32,28,.10)}
.icon-btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px;font-weight:600;width:100%}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:active{background:var(--brand-dark)}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);height:44px}
.btn-danger{background:transparent;color:var(--red);height:44px}
.btn[disabled]{opacity:.55;pointer-events:none}
.chip{height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid #D5DEDB;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* fields */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{height:52px;border:1.5px solid #D5DEDB;border-radius:14px;padding:0 14px;background:#fff;outline:none;width:100%}
.input:focus{border-color:var(--brand)}
textarea.input{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
select.input{appearance:none}
.searchbox{display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;background:var(--field);padding:0 12px;color:var(--muted)}
.searchbox input{all:unset;flex:1;color:var(--ink);font-size:15px}
.search-float{margin:-36px 20px 0;background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(16,32,28,.10);padding:6px 6px 6px 8px;display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.search-float form{display:flex;align-items:center;gap:10px;flex:1;padding-right:12px;color:var(--muted)}
.search-float input{all:unset;flex:1;height:44px;color:var(--ink);font-size:15px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.list-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;color:var(--ink);width:100%;text-align:right}
.avatar{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.badge{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.b-open{color:var(--brand);background:var(--brand-soft)}
.b-closed{color:var(--muted);background:var(--field)}
.b-low{color:var(--amber);background:var(--amber-soft)}
.b-out{color:var(--red);background:var(--red-soft)}
.b-rx{color:var(--blue);background:var(--blue-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:#12A27E;display:inline-block}
.b-closed .dot{background:var(--faint)}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 12px}
.section-head h2{font-size:17px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:22px 20px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink)}
.cat span{width:60px;height:60px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.empty{padding:36px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center}
.empty h3{color:var(--ink);font-size:16px}
.divider-list > *{border-bottom:1px solid var(--line-2)}
.divider-list > *:last-child{border-bottom:0}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(10px + var(--safe-bottom));display:grid;z-index:30}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--muted);padding:6px 0;position:relative}
.nav a.on{color:var(--brand);font-weight:600}
.nav .pill{position:absolute;top:2px;left:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* skeleton */
.sk{background:linear-gradient(90deg,#E9EEEC 25%,#F3F6F5 50%,#E9EEEC 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}

/* toast & sheet */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{background:var(--red)}
#toast.success{background:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(16,32,28,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + var(--safe-bottom));max-height:88vh;overflow:auto;animation:up .25s}
.sheet .grab{width:40px;height:5px;border-radius:999px;background:#D5DEDB;margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* map */
.map-full{position:fixed;inset:0;max-width:520px;margin:0 auto;z-index:1}
.map-top{position:fixed;top:calc(16px + var(--safe-top));left:0;right:0;max-width:520px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:10px;z-index:10}
.map-card{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-bottom));max-width:520px;margin:0 auto;padding:0 12px;z-index:10}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.pin svg{transform:rotate(45deg)}
.me-dot{width:20px;height:20px;border-radius:50%;background:#2563EB;border:4px solid #fff;box-shadow:0 0 0 9px rgba(37,99,235,.18)}
.leaflet-container{font-family:inherit;background:#E4EEEA}

/* chat */
.msgs{display:flex;flex-direction:column;gap:6px;padding:16px}
.bubble{max-width:78%;padding:10px 14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.bubble.me{align-self:flex-start;background:var(--brand);color:#fff;border-radius:18px 18px 4px 18px}
.bubble.them{align-self:flex-end;background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 4px}
.bubble img{display:block;max-width:220px;max-height:260px;border-radius:12px;margin:-4px -8px}
.stamp{font-size:11px;color:var(--muted);margin-bottom:6px}
.stamp.me{align-self:flex-start}.stamp.them{align-self:flex-end}
.composer{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(12px + var(--safe-bottom));display:flex;align-items:center;gap:8px;z-index:30}
.composer input[type=text]{flex:1;height:44px;border-radius:13px;background:var(--field);border:0;padding:0 14px;outline:none}

/* segmented */
.seg{display:flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on-ok{background:#fff;color:var(--brand)}
.seg button.on-low{background:#fff;color:var(--amber)}
.seg button.on-out{background:#fff;color:var(--red)}

.toggle-card{border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px;color:#fff;width:100%;text-align:right}
.switch{width:64px;height:36px;border-radius:999px;background:rgba(255,255,255,.25);position:relative}
.switch i{position:absolute;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps span{height:5px;border-radius:999px;background:var(--line)}
.steps span.on{background:var(--brand)}
.drop{border:2px dashed #9FC9BB;border-radius:18px;background:#F3FAF7;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--brand);text-align:center;padding:16px;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 0;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent}
.tabs button.on{color:var(--brand);font-weight:700;border-color:var(--brand)}
.stars{display:inline-flex;gap:2px;direction:ltr}
.star-pick{display:flex;gap:6px;justify-content:center;direction:ltr}
.star-pick button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.notice{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--amber-soft);color:#7A3A06}
.notice.info{background:var(--blue-soft);color:#1E3A8A}
.notice.ok{background:var(--brand-soft);color:var(--brand-dark)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/leaflet.js"></script>
<script>
'use strict';
/* =========================================================
   صيدليتي السودان — تطبيق Capacitor بملف واحد + Supabase
   ========================================================= */
const SUPABASE_URL = 'https://gsplawplbiruyjkndblg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kZMvSQWDZi3j3GqoL0GIGA_yBnyYPkX';
const DEFAULT_COORDS = { lat: 19.6158, lng: 37.2164 }; // بورتسودان
const CITIES = [
  ['portsudan','بورتسودان'],['khartoum','الخرطوم'],['omdurman','أم درمان'],['bahri','بحري'],
  ['madani','ود مدني'],['kassala','كسلا'],['gedaref','القضارف'],['atbara','عطبرة'],
  ['shendi','شندي'],['damer','الدامر'],['dongola','دنقلا'],['obeid','الأبيض'],['kosti','كوستي'],
  ['sennar','سنار'],['damazin','الدمازين'],['nyala','نيالا'],['fasher','الفاشر'],['other','مدينة أخرى']
];
const cityName = (slug) => (CITIES.find(c => c[0] === slug) || [, slug || ''])[1];

/* ---------- Capacitor helpers (تعمل أيضاً في المتصفح) ---------- */
const Cap = window.Capacitor;
const isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const Plug = (name) => (Cap && Cap.Plugins && Cap.Plugins[name]) || null;

const kv = {
  async get(k) {
    const P = isNative && Plug('Preferences');
    if (P) return (await P.get({ key: k })).value;
    try { return localStorage.getItem(k); } catch { return null; }
  },
  async set(k, v) {
    const P = isNative && Plug('Preferences');
    if (P) return P.set({ key: k, value: v });
    try { localStorage.setItem(k, v); } catch {}
  },
  async remove(k) {
    const P = isNative && Plug('Preferences');
    if (P) return P.remove({ key: k });
    try { localStorage.removeItem(k); } catch {}
  }
};

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false,
          storage: { getItem: kv.get, setItem: kv.set, removeItem: kv.remove } }
});

/* ---------- الحالة العامة ---------- */
const S = { user: null, profile: null, myPharmacy: null, coords: null, coordsReal: false, unread: 0 };

/* ---------- أيقونات (خطية بنمط Lucide) ---------- */
const P = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  back:'<path d="m9 18 6-6-6-6"/>', fwd:'<path d="m15 18-6-6 6-6"/>', down:'<path d="m6 9 6 6 6-6"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"/><path d="m8.5 8.5 7 7"/>',
  glove:'<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/>',
  kit:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M12 11v6M9 14h6"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  store:'<path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M12 10v6M9 13h6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  nav:'<path d="m3 11 19-9-9 19-2-8z"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  shieldAlert:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M12 8v4M12 16h.01"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
  locate:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  flag:'<path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  crown:'<path d="m2 7 5 4 5-7 5 7 5-4-2 12H4z"/>',
  wifiOff:'<path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8M5 12.9a10 10 0 0 1 5.2-2.7M16.8 13.2a10 10 0 0 0-1.8-1.6M12 20h.01"/>'
};
function icon(name, size = 22, sw = 1.9, extra = '') {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${P[name] || ''}</svg>`;
}

function ago(ts) {
  if (!ts) return '';
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return 'الآن';
  const m = Math.floor(s / 60); if (m < 60) return m === 1 ? 'قبل دقيقة' : m === 2 ? 'قبل دقيقتين' : `قبل ${m} دقيقة`;
  const h = Math.floor(m / 60); if (h < 24) return h === 1 ? 'قبل ساعة' : h === 2 ? 'قبل ساعتين' : `قبل ${h} ساعات`;
  const d = Math.floor(h / 24); return d === 1 ? 'أمس' : d === 2 ? 'قبل يومين' : `قبل ${d} أيام`;
}
const clock = (ts) => new Date(ts).toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' });

function errMsg(e) {

  for (const k in map) if (m.includes(k)) return map[k];

}
async function q(promise) { const { data, error } = await promise; if (error) throw error; return data; }

/* ---------- الموقع ---------- */
async function getCoords(force = false) {
  if (S.coords && !force) return S.coords;
  if (!force) {
    const saved = await kv.get('coords');
    if (saved) { try { S.coords = JSON.parse(saved); S.coordsReal = true; return S.coords; } catch {} }
  }
  try {
    let pos;
    const G = isNative && Plug('Geolocation');
    if (G) {
      try { await G.requestPermissions(); } catch {}
      pos = await G.getCurrentPosition({ enableHighAccuracy: false, timeout: 12000 });
    } else {
      pos = await new Promise((res, rej) => navigator.geolocation
        ? navigator.geolocation.getCurrentPosition(res, rej, { timeout: 12000, maximumAge: 300000 })
        : rej(new Error('no geo')));
    }
    S.coords = { lat: pos.coords.latitude, lng: pos.coords.longitude }; S.coordsReal = true;
    await kv.set('coords', JSON.stringify(S.coords));
  } catch {
    if (force) toast('تعذّر تحديد موقعك، فعّل خدمة الموقع', 'error');
    S.coords = S.coords || DEFAULT_COORDS;
  }
  return S.coords;
}

async function loadSession() {
  const { data: { session } } = await sb.auth.getSession();
  S.user = session ? session.user : null;
  S.profile = null; S.myPharmacy = null;
  if (!S.user) return;
  try {
    S.profile = await q(sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle());
    const metaName = S.user.user_metadata && S.user.user_metadata.full_name;
    if (S.profile && !S.profile.name && metaName) {
      await sb.from('profiles').update({ name: metaName }).eq('id', S.user.id);
      S.profile.name = metaName;
    }
    const ph = await q(sb.from('pharmacies').select('*').eq('owner_id', S.user.id).order('created_at').limit(1));
    S.myPharmacy = ph[0] || null;
  } catch (e) { console.warn(e); }
}
async function refreshUnread() {
  if (!S.user) { S.unread = 0; return; }
  try {
    const rows = await q(sb.from('chats').select('user_id, unread_user, unread_pharmacy'));
    S.unread = rows.reduce((n, c) => n + (c.user_id === S.user.id ? c.unread_user : c.unread_pharmacy), 0);
  } catch { S.unread = 0; }
  const pill = $('#nav-unread'); if (pill) { pill.textContent = S.unread; pill.style.display = S.unread ? 'flex' : 'none'; }
}
function requireLogin(next) {
  if (S.user) return true;
  go('/login', { next: next || location.hash.slice(1) });
  return false;
}

let cleanups = [], renderSeq = 0;
function onCleanup(fn) { cleanups.push(fn); }
function go(path, params) {
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  location.hash = path + qs;
}
function parseHash() {
  const h = location.hash.slice(1) || '/home';
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', id: parts[1], query: Object.fromEntries(new URLSearchParams(qs || '')) };
}
async function render() {
  cleanups.forEach(fn => { try { fn(); } catch {} }); cleanups = [];
  closeSheet();
  const seq = ++renderSeq;
  const r = parseHash();
  const screen = Screens[r.name] || Screens.home;
  const app = $('#app');
  app.innerHTML = skeleton();
  try {
    const out = await screen(r);
    if (seq !== renderSeq || !out) return;
    app.innerHTML = out.html;
    window.scrollTo(0, 0);
    if (out.mount) out.mount();
  } catch (e) {
    console.error(e);
    if (seq !== renderSeq) return;
    app.innerHTML = `<div class="screen no-nav">${topbar('خطأ')}${emptyState('wifiOff', 'تعذّر تحميل الصفحة', errMsg(e), `<button class="btn btn-primary" style="max-width:220px" onclick="render()">إعادة المحاولة</button>`)}</div>`;
  }
}
window.addEventListener('hashchange', render);

function parseLoc(v) {
  if (!v) return null;
  if (typeof v === 'object' && v.coordinates) return { lng: v.coordinates[0], lat: v.coordinates[1] };
  if (typeof v === 'string') {
    const m = v.match(/POINT\s*\(\s*([-\d.]+)\s+([-\d.]+)/i);
    if (m) return { lng: +m[1], lat: +m[2] };
    if (/^[0-9A-F]+$/i.test(v) && v.length >= 42) { // WKB hex (EWKB مع SRID)
      const hex = v.length === 50 ? v.slice(18) : v.slice(10);
      const rd = (h) => { const b = new DataView(new ArrayBuffer(8)); for (let i = 0; i < 8; i++) b.setUint8(i, parseInt(h.substr(i * 2, 2), 16)); return b.getFloat64(0, true); };
      return { lng: rd(hex.slice(0, 16)), lat: rd(hex.slice(16, 32)) };
    }
  }
  return null;
}
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

          <a href="#/pharmacy/${p.id}" class="row" style="color:var(--ink)"><span class="avatar" style="background:${bg};color:${fg}">${initial(p.name)}</span>
            <span class="grow col" style="gap:3px"><span class="row" style="gap:6px;font-size:16px;font-weight:700">${esc(p.name)}${p.verified ? VERIFIED : ''}</span>
            <span class="small muted">${p.is_open ? '<b style="color:var(--brand)">مفتوحة</b>' : 'مغلقة'} · ${fmtDist(p.distance_m)}${p.closes_at && !p.night_shift ? ' · حتى ' + esc(p.closes_at) : ''}</span></span>
            <button class="icon-btn" aria-label="إغلاق" id="cardx">${icon('x', 18, 2)}</button></a>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
            <a class="btn btn-primary" style="height:48px;font-size:14.5px" href="${href}" target="_blank" rel="noopener">${icon('nav', 18, 2)}الاتجاهات</a>
            <a class="btn btn-soft" style="height:48px;font-size:14.5px" href="#/pharmacy/${p.id}">التفاصيل</a></div></div>`;
        $('#cardx').addEventListener('click', e => { e.preventDefault(); card.innerHTML = ''; });
      };
      const draw = () => {
        layer.clearLayers(); card.innerHTML = '';
        document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
        const list = all.filter(p => filter === 'open' ? p.is_open : filter === 'night' ? p.night_shift : true);
        list.forEach(p => L.marker([p.lat, p.lng], { icon: pinIcon(p.is_open), title: p.name }).on('click', () => showCard(p)).addTo(layer));
        if (!list.length) toast(filter === 'all' ? 'لا توجد صيدليات مسجلة قريبة بعد' : 'لا توجد نتائج لهذا الفلتر');
      };
      document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; draw(); }));
      $('#me').addEventListener('click', async () => {
        const n = await getCoords(true); me.setLatLng([n.lat, n.lng]); map.setView([n.lat, n.lng], 15);
      });
      draw();
    }
  };
};

const signedCache = {};
async function signedUrl(path) {
  if (signedCache[path]) return signedCache[path];
  const d = await q(sb.storage.from('chat-images').createSignedUrl(path, 3600));
  return (signedCache[path] = d.signedUrl);
}
Screens.chat = async ({ id }) => {
  if (!requireLogin()) return null;
  const chat = await q(sb.from('chats').select('*, pharmacies(id, name, owner_id, phone, is_open)').eq('id', id).single());
  const msgs = await q(sb.from('messages').select('*').eq('chat_id', id).order('created_at').limit(300));
  const ph = chat.pharmacies;
  const iAmPharmacy = ph.owner_id === S.user.id;
  const [bg, fg] = tint(ph.id);
  const bubble = (m) => {
    const mine = m.sender_id === S.user.id;
    const body = m.image_path ? `<img data-img="${esc(m.image_path)}" alt="صورة مرفقة" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" style="min-width:160px;min-height:120px;background:${mine ? 'rgba(255,255,255,.15)' : 'var(--field)'}">` : '';
    return `<div class="bubble ${mine ? 'me' : 'them'}">${body}${m.body ? (body ? '<div style="margin-top:8px">' + esc(m.body) + '</div>' : esc(m.body)) : ''}</div><span class="stamp ${mine ? 'me' : 'them'}">${clock(m.created_at)}</span>`;
  };
  const dayLabel = (d) => { const t = new Date(); const y = new Date(Date.now() - 864e5); const s = new Date(d).toDateString();
    return s === t.toDateString() ? 'اليوم' : s === y.toDateString() ? 'أمس' : new Date(d).toLocaleDateString('ar', { day: 'numeric', month: 'long' }); };
  let lastDay = '';
  const withDays = (m) => { const dl = dayLabel(m.created_at); const sep = dl !== lastDay ? `<span style="align-self:center;font-size:11.5px;color:var(--muted);background:#E9EEEC;padding:4px 12px;border-radius:999px;margin:8px 0">${dl}</span>` : ''; lastDay = dl; return sep + bubble(m); };
  return {
    html: `<div class="screen no-nav" style="padding-bottom:calc(84px + var(--safe-bottom))">
      ${topbar(iAmPharmacy ? 'عميل' : esc(ph.name), { back: '/chats',
        sub: iAmPharmacy ? `محادثة مع صيدليتك` : (ph.is_open ? '<span style="color:var(--brand)">مفتوحة الآن</span>' : 'مغلقة الآن'),
        right: iAmPharmacy ? '' : `<a class="icon-btn soft" href="tel:${esc(ph.phone)}" aria-label="اتصال">${icon('phone', 20, 2)}</a>` })}
      <div class="msgs" id="msgs">${msgs.length ? msgs.map(withDays).join('') :
        `<div class="empty" style="padding:30px 10px"><div class="ic" style="background:${bg};color:${fg}">${icon('chat', 28, 1.7)}</div><h3>ابدأ المحادثة</h3><p class="small">اسأل عن توفر الدواء وسعره. يمكنك إرسال صورة الروشتة.</p></div>`}</div>
      <form class="composer" id="cmp">
        <label class="icon-btn" aria-label="إرفاق صورة" style="cursor:pointer;color:var(--muted)">${icon('camera', 20, 1.8)}<input type="file" id="img" accept="image/*" hidden></label>
        <input type="text" id="txt" placeholder="اكتب رسالتك…" autocomplete="off" maxlength="2000" aria-label="الرسالة">
        <button class="icon-btn" style="background:var(--brand);color:#fff" aria-label="إرسال" type="submit">${icon('send', 20, 2, 'style="transform:scaleX(-1)"')}</button>
      </form></div>`,
    mount() {
      const box = $('#msgs');
      const hydrate = () => box.querySelectorAll('img[data-img]').forEach(async (im) => {
        const pth = im.dataset.img; im.removeAttribute('data-img');
        try { im.src = await signedUrl(pth); im.style.minWidth = ''; im.style.minHeight = ''; im.style.background = 'none';
          im.addEventListener('click', () => openExternal(im.src)); } catch {}
      });
      const toBottom = () => window.scrollTo(0, document.body.scrollHeight);
      hydrate(); toBottom();
      sb.rpc('mark_chat_read', { cid: id }).then(refreshUnread);
      const seen = new Set(msgs.map(m => m.id));
      const add = (m) => {
        if (seen.has(m.id)) return; seen.add(m.id);
        if (!box.querySelector('.bubble')) box.innerHTML = '';
        box.insertAdjacentHTML('beforeend', withDays(m)); hydrate(); toBottom();
        if (m.sender_id !== S.user.id) sb.rpc('mark_chat_read', { cid: id });
      };
      const ch = sb.channel('chat-' + id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${id}` }, (pl) => add(pl.new)).subscribe();
      onCleanup(() => sb.removeChannel(ch));
      const send = async (payload) => {
        const m = await q(sb.from('messages').insert({ chat_id: id, ...payload }).select().single());
        add(m);
      };
      $('#cmp').addEventListener('submit', async (e) => {
        e.preventDefault();
        const t = $('#txt'), v = t.value.trim(); if (!v) return;
        t.value = '';
        try { await send({ body: v }); } catch (err) { t.value = v; toast(errMsg(err), 'error'); }
      });
      $('#img').addEventListener('change', async (e) => {
        const f = e.target.files[0]; e.target.value = ''; if (!f) return;
        toast('جارٍ إرسال الصورة…');
        try {
          const blob = await compressImage(f, 1400, 0.78);
          const path = `${id}/${Date.now()}.jpg`;
          await q(sb.storage.from('chat-images').upload(path, blob, { contentType: 'image/jpeg' }));
          await send({ image_path: path });
        } catch (err) { toast(errMsg(err), 'error'); }
      });
    }
  };
};
function compressImage(file, maxSide, quality) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error('compress')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

    <label class="list-card" style="position:relative;cursor:pointer">${icon('image', 22, 1.8)}<span class="grow col" style="gap:2px"><span class="bold" style="font-size:13.5px">${d.photo ? esc(d.photo.name) : 'صورة الصيدلية من الخارج (اختياري)'}</span><span class="small muted">تساعد العملاء على التعرّف عليها</span></span><span class="small bold" style="color:var(--brand)">${d.photo ? 'تغيير' : 'إضافة'}</span>
      <input type="file" id="r-photo" accept="image/*" style="position:absolute;inset:0;opacity:0"></label>
    <label class="row" style="align-items:flex-start;font-size:13px;line-height:1.7;color:var(--ink-2)"><input type="checkbox" id="r-pledge" ${d.pledge ? 'checked' : ''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--brand)">أتعهد بعدم صرف أدوية الوصفة دون روشتة، وبتحديث حالة الصيدلية والمخزون باستمرار</label>`;
  return {
    html: `<div class="screen no-nav" style="background:#fff">
      ${topbar('تسجيل صيدلية', { back: '/account', sub: `الخطوة ${step} من 3 · ${names[step - 1]}` })}
      <div class="pad stack" style="padding-top:18px;gap:16px">
        <div class="steps"><span class="on"></span><span class="${step >= 2 ? 'on' : ''}"></span><span class="${step >= 3 ? 'on' : ''}"></span></div>
        ${body}
        <div class="row" style="margin-top:8px">
          ${step > 1 ? `<button class="btn btn-soft" id="r-prev" style="width:auto;padding:0 20px">السابق</button>` : ''}
          <button class="btn btn-primary grow" id="r-next">${step === 3 ? 'إرسال للمراجعة' : 'التالي'}</button></div>
      </div></div>`,
    mount() {
      const save = () => {
        if (step === 1) Object.assign(d, { name: $('#r-name').value.trim(), phone: $('#r-phone').value.trim(), whatsapp: $('#r-wa').value.trim(),
          city: $('#r-city').value, opens_at: $('#r-open').value.trim(), closes_at: $('#r-close').value.trim(), night_shift: $('#r-night').checked });
        if (step === 2) d.address = $('#r-addr').value.trim();
        if (step === 3) d.pledge = $('#r-pledge').checked;
      };
      if (step === 2) {
        const start = d.loc || S.coords || DEFAULT_COORDS;
        const m = L.map('rmap', { zoomControl: false, attributionControl: false }).setView([start.lat, start.lng], d.loc ? 18 : 15);
        tiles().addTo(m);
        const upd = () => { const c = m.getCenter(); d.loc = { lat: c.lat, lng: c.lng }; };
        m.on('moveend', upd); upd();
        onCleanup(() => m.remove());
        $('#r-me').addEventListener('click', async () => { const c = await getCoords(true); m.setView([c.lat, c.lng], 18); });
      }
      if (step === 3) {
        $('#r-lic').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return;
          if (f.size > 5 * 1024 * 1024) return toast('الملف أكبر من 5 ميغا', 'error');
          save(); d.license = f; render(); });
        $('#r-photo').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; save(); d.photo = f; render(); });
      }
      const prev = $('#r-prev');
      if (prev) prev.addEventListener('click', () => { save(); Reg.step--; render(); });
      $('#r-next').addEventListener('click', async (e) => {
        save();
        if (step === 1) {
          if (d.name.length < 2) return toast('أدخل اسم الصيدلية', 'error');
          if (d.phone.replace(/\D/g, '').length < 9) return toast('أدخل رقم هاتف صحيح', 'error');
          Reg.step = 2; return render();
        }
        if (step === 2) {
          if (!d.loc) return toast('حدّد موقع الصيدلية على الخريطة', 'error');
          Reg.step = 3; return render();
        }
        if (!d.license) return toast('ارفع صورة الترخيص', 'error');
        if (!d.pledge) return toast('وافق على التعهد للمتابعة', 'error');
        const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
        try {
          const uid = S.user.id, ts = Date.now();
          let licFile = d.license, licType = d.license.type || 'application/octet-stream', ext = (d.license.name.split('.').pop() || 'jpg').toLowerCase();
          if (licType.startsWith('image/')) { licFile = await compressImage(d.license, 2000, 0.85); licType = 'image/jpeg'; ext = 'jpg'; }
          const licPath = `${uid}/license-${ts}.${ext}`;
          await q(sb.storage.from('licenses').upload(licPath, licFile, { contentType: licType }));
          let photoPath = null;
          if (d.photo) {
            photoPath = `${uid}/photo-${ts}.jpg`;
            await q(sb.storage.from('pharmacy-photos').upload(photoPath, await compressImage(d.photo, 1400, 0.8), { contentType: 'image/jpeg' }));
          }
          await q(sb.from('pharmacies').insert({
            owner_id: uid, name: d.name, phone: d.phone, whatsapp: d.whatsapp || null, address: d.address || null, city: d.city,
            location: `SRID=4326;POINT(${d.loc.lng} ${d.loc.lat})`, opens_at: d.opens_at || null, closes_at: d.closes_at || null,
            night_shift: !!d.night_shift, is_open: false, license_path: licPath, photo_path: photoPath
          }));
          Reg.step = 1; Reg.data = {};
          await loadSession();
          toast('تم الإرسال! سنراجع الترخيص قريباً', 'success');
          location.replace('#/owner');
        } catch (err) { console.error(err); toast(errMsg(err), 'error'); btn.disabled = false; btn.textContent = 'إرسال للمراجعة'; }
      });
    }
  };
};

/* ===== لوحة الصيدلي ===== */
Screens.owner = async () => {
  if (!requireLogin('/owner')) return null;
  await loadSession();
  const p = S.myPharmacy;
  if (!p) { location.replace('#/register'); return null; }
  const [inv, chats] = await Promise.all([
    q(sb.from('inventory').select('product_id, status, price, updated_at, products(name, rx)').eq('pharmacy_id', p.id)),
    q(sb.from('chats').select('unread_pharmacy').eq('pharmacy_id', p.id))
  ]);
  inv.sort((a, b) => a.products.name.localeCompare(b.products.name, 'ar'));
  const unread = chats.reduce((n, c) => n + c.unread_pharmacy, 0);
  const segBtn = (r, v, label) => `<button data-pid="${r.product_id}" data-st="${v}" class="${r.status === v ? 'on-' + v : ''}" aria-pressed="${r.status === v}">${label}</button>`;
  const stat = (ic, color, val, label, href) => `<${href ? `a href="${href}"` : 'div'} class="card" style="padding:12px;display:flex;flex-direction:column;gap:6px;color:var(--ink)"><span style="color:${color}">${icon(ic, 20, 1.8)}</span><span style="font-size:19px;font-weight:700">${val}</span><span class="small muted">${label}</span></${href ? 'a' : 'div'}>`;
  return {
    html: `<div class="screen">
      <div class="page-title row" style="justify-content:space-between;align-items:flex-start">
        <div class="col" style="gap:2px"><span class="small muted">لوحة التحكم</span><h1 style="font-size:21px">${esc(p.name)}</h1></div>
        <a href="#/pharmacy/${p.id}" class="icon-btn" aria-label="عرض صفحة الصيدلية">${icon('eye', 20, 1.8)}</a></div>
      <div class="pad stack" style="gap:16px">
        ${p.verified ? '' : `<div class="notice warn">${icon('shieldAlert', 18, 1.9)}<span><b>قيد المراجعة:</b> صيدليتك لا تظهر للعملاء حتى نتحقق من الترخيص. جهّز مخزونك الآن ليظهر مباشرة بعد التوثيق.</span></div>`}
        <button class="toggle-card" id="openT" style="background:${p.is_open ? 'var(--brand)' : '#5B6B67'}" aria-pressed="${p.is_open}">
          <span class="grow col" style="gap:4px"><span style="font-size:13px;opacity:.85">حالة الصيدلية الآن</span><span style="font-size:22px;font-weight:700">${p.is_open ? 'مفتوحة' : 'مغلقة'}</span>
          <span style="font-size:12.5px;opacity:.85">حُدّثت ${ago(p.open_updated_at)} · اضغط ${p.is_open ? 'للإغلاق' : 'للفتح'}</span></span>
          <span class="switch"><i style="left:${p.is_open ? '4px' : '32px'}"></i></span></button>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
          ${stat('chat', '#C2410C', unread, 'رسائل جديدة', '#/chats')}
          ${stat('pill', '#1D4ED8', inv.length, 'صنف في المخزون')}
          ${stat('star', '#B54708', p.rating_count ? p.rating_avg : '—', `${p.rating_count} تقييم`)}
        </div>
        <div class="row" style="justify-content:space-between;margin-top:4px"><h2 style="font-size:16px">المخزون والأسعار</h2>
          <button class="row small bold" id="addItem" style="color:var(--brand);min-height:44px;gap:4px">${icon('plus', 18, 2)}إضافة صنف</button></div>
        ${inv.length ? `<div class="card divider-list" style="padding:0 14px">${inv.map(r => `<div style="padding:12px 0" class="col">
          <div class="row"><span class="grow bold ellipsis" style="font-size:14px">${esc(r.products.name)}</span>
            <span class="seg">${segBtn(r, 'ok', 'متوفر')}${segBtn(r, 'low', 'قليل')}${segBtn(r, 'out', 'نفد')}</span></div>
          <div class="row" style="gap:8px"><label class="small muted" for="pr-${r.product_id}">السعر</label>
            <input id="pr-${r.product_id}" data-price="${r.product_id}" class="input" inputmode="decimal" dir="ltr" value="${r.price ?? ''}" placeholder="—" style="height:38px;width:120px;border-radius:10px;font-size:14px;text-align:right">
            <span class="small muted grow">ج.س</span><span class="small muted">${ago(r.updated_at)}</span>
            <button class="icon-btn" data-del="${r.product_id}" aria-label="حذف الصنف" style="width:38px;height:38px;background:none;color:var(--faint)">${icon('x', 16, 2)}</button></div></div>`).join('')}</div>
          <p class="small muted" style="line-height:1.7">كل تغيير يُحفظ فوراً ويظهر للعملاء مع وقت التحديث.</p>` :
        emptyState('pill', 'مخزونك فارغ', 'أضف الأصناف المتوفرة لديك ليجدك العملاء عند البحث عنها.', `<button class="btn btn-primary" id="addItem2" style="max-width:220px">${icon('plus', 18, 2)}إضافة أول صنف</button>`)}
      </div>${nav('/owner')}</div>`,
    mount() {
      $('#openT').addEventListener('click', async () => {
        try { await q(sb.from('pharmacies').update({ is_open: !p.is_open }).eq('id', p.id)); toast(p.is_open ? 'أصبحت الصيدلية مغلقة' : 'أصبحت الصيدلية مفتوحة', 'success'); render(); }
        catch (e) { toast(errMsg(e), 'error'); }
      });
      document.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', async () => {
        const pid = b.dataset.pid, st = b.dataset.st;
        try {
          await q(sb.from('inventory').update({ status: st }).eq('pharmacy_id', p.id).eq('product_id', pid));
          b.parentElement.querySelectorAll('button').forEach(x => { x.className = x.dataset.st === st ? 'on-' + st : ''; x.setAttribute('aria-pressed', x.dataset.st === st); });
        } catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-price]').forEach(inp => inp.addEventListener('change', async () => {
        const v = inp.value.replace(/[,\s]/g, '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        const price = v === '' ? null : Number(v);
        if (price != null && (isNaN(price) || price < 0)) return toast('أدخل سعراً صحيحاً', 'error');
        try { await q(sb.from('inventory').update({ price }).eq('pharmacy_id', p.id).eq('product_id', inp.dataset.price)); toast('تم حفظ السعر', 'success'); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        try { await q(sb.from('inventory').delete().eq('pharmacy_id', p.id).eq('product_id', b.dataset.del)); render(); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      const add = () => addItemSheet(p.id, new Set(inv.map(r => r.product_id)));
      ['#addItem', '#addItem2'].forEach(s => { const el = $(s); if (el) el.addEventListener('click', add); });
    }
  };
};
function addItemSheet(pharmacyId, existing) {
  openSheet(`<h3>إضافة صنف للمخزون</h3>
    <label class="searchbox" style="margin-bottom:12px">${icon('search', 18, 2)}<input id="aq" placeholder="ابحث في الكتالوج" autocomplete="off"></label>
    <div id="ares" class="divider-list" style="min-height:200px"></div>
    <p class="small muted" style="margin-top:12px;line-height:1.7">لم تجد الصنف؟ أرسل اسمه لنا عبر الدعم وسنضيفه للكتالوج.</p>`, () => {
    const input = $('#aq'), box = $('#ares'); let t;
    const run = async () => {
      const term = input.value.trim();
      try {
        const rows = term.length >= 2 ? await q(sb.rpc('search_products', { q: term })) : await q(sb.from('products').select('*').order('name').limit(40));
        box.innerHTML = rows.length ? rows.map(r => `<button class="row" data-add="${r.id}" style="width:100%;padding:12px 0;text-align:right" ${existing.has(r.id) ? 'disabled' : ''}>
          <span class="grow col" style="gap:2px"><span class="bold" style="font-size:14px">${esc(r.name)}</span>${r.generic ? `<span class="small muted">${esc(r.generic)}</span>` : ''}</span>
          ${existing.has(r.id) ? '<span class="small muted">مضاف</span>' : `<span class="icon-btn soft" style="width:36px;height:36px">${icon('plus', 18, 2)}</span>`}</button>`).join('') :
          `<p class="small muted" style="padding:20px 0;text-align:center">لا نتائج</p>`;
        box.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', async () => {
          try {
            await q(sb.from('inventory').insert({ pharmacy_id: pharmacyId, product_id: b.dataset.add, status: 'ok' }));
            existing.add(b.dataset.add); b.disabled = true; b.lastElementChild.outerHTML = '<span class="small" style="color:var(--brand);font-weight:600">تمت الإضافة</span>';
            closeSheet._dirty = true;
          } catch (e) { toast(errMsg(e), 'error'); }
        }));
      } catch (e) { box.innerHTML = `<p class="small muted">${errMsg(e)}</p>`; }
    };
    input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(run, 300); });
    run();
    const ov = $('#sheet');
    ov.addEventListener('click', (e) => { if (e.target === ov && closeSheet._dirty) { closeSheet._dirty = false; render(); } });
  });
}

/* ===== لوحة المشرف ===== */
Screens.admin = async ({ query }) => {
  if (!requireLogin('/admin')) return null;
  if (!S.profile || !S.profile.is_admin) return { html: `<div class="screen no-nav">${topbar('غير مسموح')}${emptyState('lock', 'هذه الصفحة للمشرف فقط', '')}</div>` };
  const tab = query.tab || 'pending';
  let content = '';
  if (tab === 'pending') {
    const rows = await q(sb.from('pharmacies').select('*').eq('verified', false).order('created_at'));
    content = rows.length ? rows.map(p => `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div class="col" style="gap:2px"><b>${esc(p.name)}</b><span class="small muted">${esc(cityName(p.city))}${p.address ? ' · ' + esc(p.address) : ''} · <span dir="ltr">${esc(p.phone)}</span></span><span class="small muted">سُجّلت ${ago(p.created_at)}</span></div>
      <div class="row"><button class="btn btn-soft" style="height:44px;font-size:14px" data-lic="${esc(p.license_path || '')}">${icon('file', 18, 2)}عرض الترخيص</button>
        <button class="btn btn-primary" style="height:44px;font-size:14px" data-verify="${p.id}">${icon('check', 18, 2)}توثيق</button></div></div>`).join('') :
      emptyState('shield', 'لا توجد طلبات معلقة', 'كل الصيدليات المسجلة موثقة.');
  } else if (tab === 'reports') {
    const rows = await q(sb.from('reports').select('*, pharmacies(name)').order('created_at', { ascending: false }).limit(100));
    const T = { closed: 'مغلقة وتظهر مفتوحة', wrong_price: 'سعر خاطئ', out_of_stock: 'غير متوفر', other: 'أخرى' };
    content = rows.length ? `<div class="card divider-list" style="padding:0 14px">${rows.map(r => `<div class="row" style="padding:12px 0"><span class="grow col" style="gap:2px"><b style="font-size:14px">${esc(r.pharmacies ? r.pharmacies.name : '')}</b><span class="small muted">${T[r.type]} · ${ago(r.created_at)}</span></span><button class="icon-btn" data-rdel="${r.id}" aria-label="حذف البلاغ">${icon('check', 18, 2)}</button></div>`).join('')}</div>` :
      emptyState('flag', 'لا توجد بلاغات', '');
  } else {
    content = `<form id="prodForm" class="card stack" style="padding:16px;gap:14px">
      <div class="field"><label for="p-name">اسم الصنف كما يُباع</label><input class="input" id="p-name" required placeholder="مثال: بنادول إكسترا 24 قرص"></div>
      <div class="field"><label for="p-gen">الاسم العلمي</label><input class="input" id="p-gen" placeholder="مثال: باراسيتامول + كافيين"></div>
      <div class="field"><label for="p-cat">الفئة</label><select class="input" id="p-cat"><option value="medicine">أدوية</option><option value="gloves">قفازات</option><option value="supplies">مستلزمات</option></select></div>
      <label class="row" style="min-height:44px;font-size:14px"><input type="checkbox" id="p-rx" style="width:20px;height:20px;accent-color:var(--brand)">يحتاج وصفة طبية</label>
      <button class="btn btn-primary" type="submit">${icon('plus', 18, 2)}إضافة للكتالوج</button></form>`;
  }
  const tabs = [['pending', 'طلبات التوثيق'], ['reports', 'البلاغات'], ['catalog', 'الكتالوج']];
  return {
    html: `<div class="screen no-nav">${topbar('لوحة المشرف', { back: '/account' })}
      <div class="pad" style="padding-top:12px"><div class="chips">${tabs.map(([k, v]) => `<a class="chip ${tab === k ? 'on' : ''}" href="#/admin?tab=${k}">${v}</a>`).join('')}</div></div>
      <div class="pad stack" style="padding-top:16px">${content}</div></div>`,
    mount() {
      document.querySelectorAll('[data-lic]').forEach(b => b.addEventListener('click', async () => {
        if (!b.dataset.lic) return toast('لا يوجد ترخيص مرفوع', 'error');
        try { const d = await q(sb.storage.from('licenses').createSignedUrl(b.dataset.lic, 600)); openExternal(d.signedUrl); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-verify]').forEach(b => b.addEventListener('click', async () => {
        try { await q(sb.from('pharmacies').update({ verified: true }).eq('id', b.dataset.verify)); toast('تم توثيق الصيدلية', 'success'); render(); }
        catch (e) { toast(errMsg(e), 'error'); }
      }));
      document.querySelectorAll('[data-rdel]').forEach(b => b.addEventListener('click', async () => {
        try { await q(sb.from('reports').delete().eq('id', b.dataset.rdel)); render(); } catch (e) { toast(errMsg(e), 'error'); }
      }));
      const f = $('#prodForm');
      if (f) f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = $('#p-name').value.trim(); if (!name) return;
        try {
          await q(sb.from('products').insert({ name, generic: $('#p-gen').value.trim() || null, category: $('#p-cat').value, rx: $('#p-rx').checked }));
          toast('أُضيف الصنف', 'success'); f.reset();
        } catch (err) { toast(errMsg(err), 'error'); }
      });
    }
  };
};

/* ---------- الروابط الخارجية (خرائط، واتساب، ملفات) ---------- */
function openExternal(url) {
  if (isNative) location.href = url; // Capacitor يفتحها في التطبيق المناسب (خرائط جوجل، واتساب، المتصفح)
  else window.open(url, '_blank', 'noopener');
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[target="_blank"]');
  if (!a) return;
  e.preventDefault(); openExternal(a.href);
});

/* ---------- التشغيل ---------- */
(async function boot() {
  const SBar = isNative && Plug('StatusBar');
  if (SBar) { try { await SBar.setBackgroundColor({ color: '#0B6E5B' }); await SBar.setStyle({ style: 'DARK' }); } catch {} }
  const App = isNative && Plug('App');
  if (App) App.addListener('backButton', () => {
    if ($('#sheet')) return closeSheet();
    const n = parseHash().name;
    if (n === 'home' || n === 'login') App.exitApp(); else history.back();
  });
  await loadSession();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' || ev === 'TOKEN_REFRESHED') loadSession(); });
  refreshUnread();
  const first = await kv.get('seen_intro');
  if (!S.user && !first && !location.hash) { await kv.set('seen_intro', '1'); location.replace('#/login'); }
  render();
})();
</script>
