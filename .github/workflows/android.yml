name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # كل المكتبات تُحمَّل هنا فقط (Capacitor + Supabase + Leaflet)
      - name: Download libraries
        run: npm install --no-audit --no-fund

      - name: Copy web libraries to www/vendor
        run: |
          node scripts/copy-vendor.js
          ls -la www/vendor

      # الإشعارات: ملف Firebase من أسرار GitHub (إن وُجد)
      - name: Enable push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            sed -i "s/'__PUSH__'/'on'/" www/index.html
            echo "push: on"
          else
            echo "push: off (secret GOOGLE_SERVICES_JSON not set)"
          fi

      - name: Stamp build version
        run: sed -i "s/__BUILD__/${{ github.run_number }} · $(date -u +%Y-%m-%d)/" www/index.html

      - name: Add Android platform (first time)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          bash scripts/android-permissions.sh

      # أيقونة التطبيق وشاشة البداية من مجلد assets
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 -c "import json;json.load(open('android/app/google-services.json'))" && echo "google-services.json ok"
          fi

      - name: Generate icon and splash
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0B6E5B' --iconBackgroundColorDark '#0B6E5B' \
            --splashBackgroundColor '#0B6E5B' --splashBackgroundColorDark '#0D1412'

      - name: Sync web code
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sydaliati-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # نشر APK على رابط ثابت يُحمَّل من الهاتف مباشرة
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sydaliati.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest sydaliati.apk \
            --title "حبّة — آخر نسخة" \
            --notes "نسخة تجريبية مبنية تلقائياً من آخر تعديل: ${{ github.event.head_commit.message || 'تشغيل يدوي' }}" \
            --prerelease
